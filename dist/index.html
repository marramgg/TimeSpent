<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSpent</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TimeSpent"><meta name="theme-color" content="#EFE2C6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F6C445'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23FFF8EA' stroke='%2333241A' stroke-width='4'/%3E%3Cline x1='50' y1='50' x2='50' y2='28' stroke='%2333241A' stroke-width='6' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23E4526E' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* ===== TimeSpent — styles ===== */
:root {
  --paper: #FFF8EA; --paper-2: #FBEFD6; --table: #EFE2C6;
  --wood: #F3D6A3; --wood-dark: #C98D4E; --wood-edge: #8E5B2C;
  --ink: #33241A; --ink-soft: #7B6552; --ink-line: #33241A;
  --berry: #E4526E; --berry-dark: #B23550;
  --leaf: #67B95A; --leaf-dark: #3F8F36;
  --gold: #F6C445; --gold-dark: #C88A12; --gold-light: #FFE38A;
  --sky-blue: #5FBBEF; --pink: #F58FB6; --lilac: #C79BE8; --grey: #D8CBB6;
  --night: #17213F; --night-2: #2B3A6B;
  --radius: 22px; --line: 3px;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --fs: clamp(16px, 2.1vmin + 8px, 22px);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--table); overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font-body); font-size: var(--fs); color: var(--ink); line-height: 1.25;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sky-blue); outline-offset: 2px; }
svg { display: block; }
.hidden { display: none !important; }

/* ---------- app frame ---------- */
.app { position: fixed; inset: 0; height: 100dvh; width: 100%; background: var(--table); overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; }
.app[data-screen="start"] #start, .app[data-screen="game"] #game { display: flex; }

/* ---------- buttons (chunky, pressable) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 60px; padding: .55em 1.1em;
  border-radius: var(--radius); background: var(--gold); color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 1.15em;
  border: var(--line) solid var(--ink-line); box-shadow: 0 6px 0 var(--ink-line); transform: translateY(0); transition: transform .08s, box-shadow .08s; }
.btn:active, .btn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink-line); }
.btn.secondary { background: var(--paper); }
.btn.leaf { background: var(--leaf); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.berry { background: var(--berry); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.sky { background: var(--sky-blue); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.big { min-height: 76px; font-size: 1.5em; padding: .5em 1.4em; }
.btn[aria-disabled="true"] { background: var(--grey); color: var(--ink-soft); box-shadow: 0 6px 0 #9d8f7c; border-color: #9d8f7c; }

/* ---------- start screen ---------- */
.start { flex-direction: column; align-items: center; justify-content: center; gap: 1.2em; padding: calc(var(--sat) + 16px) 20px calc(var(--sab) + 20px);
  background: linear-gradient(180deg, #8FD0F5 0%, #D8F1FF 55%, #BFE39C 55.2%, #A6D682 100%); text-align: center; }
.start .logo { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vmin, 92px); line-height: 1; color: var(--ink); letter-spacing: -.01em;
  text-shadow: 0 4px 0 #fff, 0 8px 0 rgba(0,0,0,.12); }
.start .logo b { color: var(--berry); }
.start .tagline { font-weight: 700; font-size: 1.05em; color: var(--ink-soft); max-width: 22em; text-wrap: balance; margin: 0; }
.start .pick { font-family: var(--font-display); font-size: 1.3em; margin: .4em 0 0; }
.avatars { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.avatar-btn { width: clamp(64px, 14vmin, 96px); height: clamp(64px, 14vmin, 96px); border-radius: 50%; background: var(--paper); border: var(--line) solid var(--ink-line);
  box-shadow: 0 5px 0 var(--ink-line); font-size: clamp(34px, 7.5vmin, 54px); display: grid; place-items: center; transition: transform .1s; }
.avatar-btn[aria-pressed="true"] { background: var(--gold-light); transform: scale(1.12); box-shadow: 0 5px 0 var(--ink-line), 0 0 0 6px rgba(246,196,69,.55); }
.start .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.lang-row { position: absolute; top: calc(var(--sat) + 12px); right: 14px; display: flex; gap: 6px; }
.seg { display: inline-flex; border: var(--line) solid var(--ink-line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.seg button { padding: .35em .9em; font-family: var(--font-display); font-weight: 600; min-height: 44px; min-width: 56px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.start .clock-hero { width: clamp(120px, 26vmin, 200px); filter: drop-shadow(0 6px 0 rgba(0,0,0,.15)); }

/* ---------- game layout ---------- */
.game { flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(var(--sat) + 8px) calc(var(--sar) + 14px) 6px calc(var(--sal) + 14px); }
.topbar .gear { margin-left: auto; flex: 0 0 auto; }
@media (max-width: 480px) {
  .meters { grid-template-columns: .8fr 1.25fr 1.05fr auto; gap: 5px; }
  .meter.wallet .lab .count { font-size: 1.15em; }
  .meter .lab span[data-i18n] { display: none; } .meter .lab { font-size: 1.05em; }
  .meter, .wallet { padding: 4px 6px; }
  .meter .segs { gap: 2px; } .meter .segs i { height: 11px; }
  .meter.fridge .stack { grid-template-columns: repeat(6, 9px); font-size: 8px; } .meter.fridge .stack .apple { width: 9px; height: 9px; }
  .wallet .coinstack { grid-template-columns: repeat(5, 12px); gap: 2px; } .wallet .count { font-size: 1.3em; min-width: 1.1em; }
  .coin { width: 12px; height: 12px; }
  .weatherchip .wt { display: none; } .weatherchip { padding: .2em .5em; font-size: 1.1em; }
  .daylabel .wk { font-size: .65em; padding: .15em .5em; }
  .daylabel .wd { font-size: .95em; }
}
.daylabel { display: flex; align-items: baseline; gap: .5em; font-family: var(--font-display); white-space: nowrap; min-width: 0; }
.daylabel .n { font-weight: 700; font-size: 1.2em; }
.daylabel .wd { font-weight: 600; color: var(--ink-soft); }
.daylabel .wk { font-size: .75em; font-weight: 700; background: var(--pink); color: #fff; padding: .15em .6em; border-radius: 999px; border: 2px solid var(--ink-line); }
.weatherchip { display: inline-flex; align-items: center; gap: .35em; font-family: var(--font-display); font-weight: 600; background: var(--paper); border: 2px solid var(--ink-line); border-radius: 999px; padding: .2em .7em; }
.gear { width: 46px; height: 46px; border-radius: 50%; font-size: 22px; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--ink-line); opacity: .8; position: relative; }
.gear .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid var(--sky-blue); clip-path: inset(0 100% 0 0); opacity: 0; }
.gear.holding .ring { opacity: 1; animation: holdfill 1.1s linear forwards; }
@keyframes holdfill { to { clip-path: inset(0 0 0 0); } }

.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px); }

/* hero: sky + clock + beads */
.hero { position: relative; border-radius: var(--radius); border: var(--line) solid var(--ink-line); overflow: hidden; background: var(--paper); flex: 0 0 auto; }
.sky { position: relative; height: clamp(120px, 22vh, 210px); overflow: hidden; }
.sky .layer { position: absolute; inset: 0; transition: opacity 1s ease; }
.sky .day { background: linear-gradient(180deg, #55B7F0 0%, #A9E0FF 70%, #DDF4FF 100%); }
.sky .dusk { background: linear-gradient(180deg, #7A6BC8 0%, #F29A7A 55%, #FFD48A 100%); opacity: 0; }
.sky .nightl { background: linear-gradient(180deg, #0F1834 0%, #22305E 70%, #3B4E85 100%); opacity: 0; }
.sky .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1s;
  background-image: radial-gradient(2px 2px at 12% 30%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 28% 12%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 44% 26%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 62% 10%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 75% 32%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 88% 18%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 55% 40%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 20% 48%, #fff 60%, transparent 62%); }
.sky .hills { position: absolute; left: -5%; right: -5%; bottom: -2px; height: 34%; }
.sky .hills path { transition: fill 1s; }
.sky .sun, .sky .moon { position: absolute; width: 14%; max-width: 64px; aspect-ratio: 1; border-radius: 50%; left: 0; top: 0;
  transform: translate(-50%, -50%); transition: left 1s ease-in-out, top 1s ease-in-out, opacity .8s; }
.sky .sun { background: radial-gradient(circle at 40% 35%, #FFF3A6, #FFD23F 60%, #F5A623); box-shadow: 0 0 0 6px rgba(255,220,90,.35), 0 0 30px 10px rgba(255,210,70,.45); }
.sky .sun::after { content: ''; position: absolute; inset: -32%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,235,120,.55) 0 6deg, transparent 6deg 30deg); animation: spin 40s linear infinite; }
.sky .moon { background: radial-gradient(circle at 35% 35%, #FFFCE6, #E8E2B8 70%, #C9C08E); box-shadow: 0 0 24px 6px rgba(255,250,200,.35); opacity: 0; }
.sky .moon::before, .sky .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(160,150,110,.35); }
.sky .moon::before { width: 22%; height: 22%; left: 28%; top: 30%; } .sky .moon::after { width: 14%; height: 14%; left: 58%; top: 55%; }
@keyframes spin { to { transform: rotate(360deg); } }
.sky .cloud { position: absolute; width: 22%; height: 22%; top: 18%; left: 60%; opacity: .95; transition: opacity 1s; animation: drift 38s linear infinite; }
.sky .cloud.c2 { left: 10%; top: 40%; width: 16%; height: 16%; animation-duration: 52s; animation-delay: -20s; }
.sky .cloud i { position: absolute; background: #fff; border-radius: 50%; }
.sky .cloud i:nth-child(1) { width: 60%; height: 60%; left: 20%; top: 20%; }
.sky .cloud i:nth-child(2) { width: 45%; height: 45%; left: 0; top: 40%; }
.sky .cloud i:nth-child(3) { width: 50%; height: 50%; left: 48%; top: 38%; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-140%); } }
.sky.rain .cloud i { background: #B9C3CF; }
.sky .rain-layer, .sky .snow-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1s; pointer-events: none; }
.sky.rain .rain-layer { opacity: .8; background-image: repeating-linear-gradient(115deg, transparent 0 14px, rgba(255,255,255,.55) 14px 16px); background-size: 40px 40px; animation: rainfall .6s linear infinite; }
@keyframes rainfall { from { background-position: 0 0; } to { background-position: -20px 40px; } }
.sky.cold .snow-layer { opacity: .9; background-image: radial-gradient(3px 3px at 20% 20%, #fff 60%, transparent 62%), radial-gradient(3px 3px at 60% 50%, #fff 60%, transparent 62%), radial-gradient(2.5px 2.5px at 85% 30%, #fff 60%, transparent 62%), radial-gradient(2.5px 2.5px at 40% 75%, #fff 60%, transparent 62%); background-size: 120px 120px; animation: snowfall 6s linear infinite; }
@keyframes snowfall { from { background-position: 0 -120px; } to { background-position: 30px 0; } }
.sky.cold .day { filter: saturate(.6) brightness(1.05); }
.sky.rain .day { filter: saturate(.35) brightness(.85); }
.sky.rain .sun { filter: grayscale(.5) opacity(.35); } .sky.rain .sun::after { display: none; }

.clockrow { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vw, 28px); padding: 8px 12px 6px; margin-top: calc(-1 * clamp(38px, 7vh, 64px)); position: relative; z-index: 2; }
.clock { width: clamp(118px, 30vmin, 190px); aspect-ratio: 1; filter: drop-shadow(0 6px 0 rgba(51,36,26,.9)); }
.clock .hand { transform-origin: 100px 100px; transition: transform .6s cubic-bezier(.5,0,.3,1); }
.clock.spin .hand { transition: transform 4.5s cubic-bezier(.4,0,.2,1); }
.digital { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-family: var(--font-display); background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 18px; padding: .3em .7em .4em; box-shadow: 0 5px 0 var(--ink-line); min-width: 5.2em; }
.digital .t { font-size: clamp(30px, 6.5vmin, 46px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.digital .p { font-size: .9em; font-weight: 600; color: var(--ink-soft); text-transform: lowercase; }
.digital .ico { font-size: 1em; }

.daybar { position: relative; padding: 14px 12px 4px; }
.daybar .cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.daybar .cells .c { height: clamp(9px, 1.6vh, 15px); border-radius: 3px; background: #E9DFC7; border: 1.5px solid rgba(51,36,26,.14); display: flex; overflow: hidden; }
.daybar .cells .c b { flex: 1; display: block; height: 100%; }
.daybar .cells .c.pv { border-color: rgba(51,36,26,.5); }
.daybar .cells .c.night { background: var(--night-2); border-color: rgba(51,36,26,.35); background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.12) 4px 6px); }
.daybar .cells .c:nth-child(14) { margin-right: 1px; }
.daybar .plan { position: relative; height: clamp(15px, 2.4vh, 20px); margin: 3px 0 0; }
.daybar .plan .band { position: absolute; top: 0; height: 100%; box-sizing: border-box; border: 1.5px solid rgba(51,36,26,.35); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.daybar .plan .band em { font-style: normal; font-size: clamp(10px, 1.6vh, 13px); line-height: 1; }
.daybar .labels { position: relative; height: 12px; margin-top: 2px; font-family: var(--font-display); font-size: .62em; color: var(--ink-soft); line-height: 1; }
.daybar .labels span { position: absolute; top: 0; padding-left: 1px; }
.daybar .track { position: absolute; left: 12px; right: 12px; top: 14px; bottom: 16px; pointer-events: none; }
.daybar .now { position: absolute; top: -6px; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; }
.daybar .now::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top: 7px solid var(--ink); border-bottom: 0; }
.daybar .now::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--berry); border: 2px solid var(--ink); }
.daybar .ghost { position: absolute; top: -6px; bottom: 0; width: 0; border-left: 2px dashed var(--ink); margin-left: -1px; pointer-events: none; }
.daybar .ghost b { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 700; font-size: 11px; line-height: 1; padding: 2px 5px; border-radius: 6px; background: var(--ink); color: #fff; white-space: nowrap; z-index: 2; }
.daybar .ghost::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
.daybar.sum { padding: 8px 0 0; }
.daybar.sum .cells .c { height: 16px; } .daybar.sum .plan { height: 20px; } .daybar.sum .plan .band em { font-size: 13px; }

/* status: buddy + meters */
.status { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: stretch; flex: 0 0 auto; }
.buddy { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
.avatar { width: clamp(58px, 12vmin, 84px); height: clamp(58px, 12vmin, 84px); border-radius: 50%; background: var(--paper); border: var(--line) solid var(--ink-line); display: grid; place-items: center; font-size: clamp(32px, 7vmin, 48px); flex: 0 0 auto; box-shadow: 0 4px 0 var(--ink-line); }
.avatar.bounce { animation: bounce .5s; }
@keyframes bounce { 30% { transform: translateY(-8px) scale(1.05); } 60% { transform: translateY(2px); } }
.bubble { position: relative; flex: 1; min-height: 58px; background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 18px; padding: .45em 3em .45em .8em; font-weight: 700; font-size: 1em; display: flex; align-items: center; box-shadow: 0 4px 0 var(--ink-line); }
.bubble::before { content: ''; position: absolute; left: -13px; top: 50%; width: 18px; height: 18px; background: var(--paper); border-left: var(--line) solid var(--ink-line); border-bottom: var(--line) solid var(--ink-line); transform: translateY(-50%) rotate(45deg); }
.bubble p { margin: 0; text-wrap: pretty; }
.bubble .speak { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; display: grid; place-items: center; background: var(--paper-2); border: 2px solid var(--ink-line); }
.bubble .speak.on { background: var(--gold-light); }

.meters { display: grid; grid-template-columns: 1fr 1.1fr 1fr 1fr; gap: 8px; grid-column: 1 / -1; }
.meter.fridge .apples { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.meter.fridge .stack { display: grid; grid-template-columns: repeat(6, 11px); gap: 1px; font-size: 10px; line-height: 1; max-height: 24px; overflow: hidden; }
.meter.fridge .stack .apple { display: block; width: 11px; height: 11px; }
.meter.fridge .stack .empty { color: var(--ink-soft); font-weight: 800; }
.meter.fridge .lab .count { font-family: var(--font-display); font-weight: 700; font-size: 1.15em; font-variant-numeric: tabular-nums; margin-left: auto; }
.meter.fridge .lunch { font-size: 1.05em; }
.meter.fridge.low .lab { animation: wiggle 1.2s ease-in-out infinite; }
.meter { background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow: hidden; }
.meter .lab { display: flex; align-items: center; gap: .3em; font-family: var(--font-display); font-weight: 600; font-size: .8em; white-space: nowrap; min-width: 0; overflow: hidden; }
.meter .lab span[data-i18n] { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.meter .lab .coin, .meter .lab .count, .meter .lab .pvd, .meter .lab .lunch { flex: 0 0 auto; }
.meter .segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.meter .segs i { height: 14px; border-radius: 5px; background: #EDE3CF; border: 2px solid rgba(51,36,26,.2); transition: background .3s; }
.meter.tummy .segs i.on { background: var(--leaf); border-color: var(--leaf-dark); }
.meter.tummy.low .segs i.on { background: var(--berry); border-color: var(--berry-dark); }
.meter.happy .segs i.on { background: var(--pink); border-color: #C55A85; }
.meter.happy.low .segs i.on { background: var(--berry); border-color: var(--berry-dark); }
@keyframes pvpulse { 50% { opacity: .35; } }
.meter .segs i.lose { background: repeating-linear-gradient(135deg, var(--berry) 0 3px, #fff 3px 6px) !important; border-color: var(--berry-dark) !important; animation: pvpulse 1s ease-in-out infinite; }
.meter.tummy .segs i.gain { background: repeating-linear-gradient(135deg, var(--leaf) 0 3px, #fff 3px 6px); border-color: var(--leaf-dark); }
.meter.happy .segs i.gain { background: repeating-linear-gradient(135deg, var(--pink) 0 3px, #fff 3px 6px); border-color: #C55A85; }
.meter.fridge .apple.lose { opacity: .4; filter: saturate(.4); animation: pvpulse 1s ease-in-out infinite; }
.meter.fridge .apple.gain { opacity: .5; filter: grayscale(.7); }
.coin.lose { opacity: .35; animation: pvpulse 1s ease-in-out infinite; }
.coin.gain { background: #fff; border-style: dashed; box-shadow: none; opacity: .85; }
.meter .lab .pvd { font-family: var(--font-display); font-weight: 800; font-size: .9em; color: var(--leaf-dark); margin-left: 2px; }
.meter .lab .pvd.down { color: var(--berry-dark); }
.meter.low .lab { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.wallet { background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }

  background: var(--paper-2); border: var(--line) solid var(--ink-line); box-shadow: 0 5px 0 var(--ink-line); transition: transform .08s, box-shadow .08s; position: relative; }

/* ---------- sheets & overlays ---------- */
.sheet, .overlay { position: absolute; inset: 0; z-index: 20; display: none; }

.tile .ts.open { color: var(--leaf-dark); }
.tile .ts.closed { color: var(--berry-dark); }
.tile.here { background: var(--gold-light); }
.tile.here::after { content: '📍'; position: absolute; top: 6px; right: 8px; }

.tile .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; }
.tile .tbtn { margin-top: auto; min-height: 44px; padding: .25em .8em; border-radius: 999px; border: 2px solid var(--ink-line); background: var(--gold); font-family: var(--font-display); font-weight: 600; box-shadow: 0 3px 0 var(--ink-line); }
.tile .tbtn.wish { background: var(--paper); }
.tile .tbtn.wish.on { background: var(--pink); color: #fff; }
.tile .tbtn.got { background: var(--leaf); color: #fff; }
.tile .tbtn.need { background: #EDE6DA; color: var(--ink-soft); box-shadow: 0 3px 0 #A99C88; border-color: #A99C88; }
.tile .badge { position: absolute; top: -8px; left: -8px; background: var(--pink); color: #fff; border: 2px solid var(--ink-line); border-radius: 999px; font-size: .8em; padding: .05em .5em; font-weight: 800; }
.tabs { display: flex; gap: 8px; }
.tabs button { flex: 1; min-height: 50px; border-radius: 999px; border: var(--line) solid var(--ink-line); background: var(--paper-2); font-family: var(--font-display); font-weight: 600; font-size: 1.05em; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
.modes { display: grid; grid-template-columns: 1fr; grid-auto-rows: max-content; gap: 10px; }
.modes .action { min-height: 70px; }
.travel-dest { display: flex; align-items: center; gap: .5em; font-family: var(--font-display); font-weight: 700; font-size: 1.3em; }

.overlay .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 560px); max-height: 92%; overflow-y: auto; background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 26px;
  padding: 18px 18px calc(var(--sab) + 18px); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 0 var(--ink-line); animation: popin .3s ease-out; }
@keyframes popin { from { transform: translate(-50%, -46%) scale(.96); opacity: 0; } }
.overlay .card .big-row { display: flex; justify-content: center; }
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sumcell { background: var(--paper-2); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 8px; text-align: center; }
.sumcell .k { font-size: .8em; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.sumcell .v { font-family: var(--font-display); font-weight: 700; font-size: 1.7em; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sumcell.earn .v { color: var(--leaf-dark); } .sumcell.spend .v { color: var(--berry-dark); }
.walletline { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.2em; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.legend div { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.legend .sw { width: 16px; height: 16px; border-radius: 5px; border: 2px solid rgba(51,36,26,.5); flex: 0 0 auto; }
.legend .wide { grid-column: 1 / -1; }
.legend .tchips svg { width: 16px; height: 16px; }
.forecast { display: flex; align-items: center; justify-content: center; gap: .5em; font-family: var(--font-display); font-weight: 600; font-size: 1.15em; background: var(--paper-2); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 8px; }

.night-screen { background: var(--night); }
.night-screen .scrim { background: transparent; }
.night-screen .starsbig { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 10% 20%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 30% 10%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 50% 30%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 70% 15%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 85% 35%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 20% 55%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 60% 60%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 90% 70%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 40% 80%, #fff 60%, transparent 62%); animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .6; } to { opacity: 1; } }
.night-screen .card { background: transparent; border: 0; box-shadow: none; color: #fff; align-items: center; text-align: center; }

@keyframes floatz { 50% { transform: translateY(-10px); } }
.night-screen .clock { width: clamp(130px, 30vmin, 200px); }
.night-screen .sleeper { font-size: clamp(56px, 14vmin, 96px); line-height: 1; }

.morning-screen .card { text-align: center; align-items: center; }
.morning-screen .sunbig { width: clamp(80px, 18vmin, 140px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFF3A6, #FFD23F 60%, #F5A623); box-shadow: 0 0 0 8px rgba(255,220,90,.35), 0 0 40px 14px rgba(255,210,70,.45); animation: sunrise .8s ease-out; }
@keyframes sunrise { from { transform: translateY(40px) scale(.6); opacity: 0; } }
.morning-screen .mday { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 6vmin, 40px); }
.morning-screen .mweather { font-family: var(--font-display); font-weight: 600; font-size: 1.3em; display: flex; align-items: center; gap: .4em; }
.morning-screen .mweather .fe { font-size: 1.8em; }

/* settings */
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings .row .k { font-family: var(--font-display); font-weight: 600; font-size: 1.1em; }
.settings .about { font-size: .95em; color: var(--ink-soft); margin: 0; font-weight: 600; }
.settings .danger { display: flex; flex-direction: column; gap: 8px; }

/* toast */
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translateX(-50%); z-index: 30; background: var(--ink); color: #fff; font-family: var(--font-display); font-weight: 600; padding: .5em 1em; border-radius: 999px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }

/* flying coins */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.fx .coin { position: absolute; width: 24px; height: 24px; will-change: transform; }

/* ---------- wide / landscape (iPad) ---------- */
@media (min-width: 860px) and (orientation: landscape) {
  .body { display: grid; grid-template-columns: minmax(360px, 46%) 1fr; grid-template-rows: auto 1fr; gap: 12px; padding-bottom: 12px; }
  .hero { grid-column: 1; grid-row: 1; }
  .status { grid-column: 1; grid-row: 2; align-content: start; }
  .place { grid-column: 2; grid-row: 1 / 3; border-radius: var(--radius); border-bottom: var(--line) solid var(--ink-line); }
  .actions { grid-template-columns: 1fr 1fr; padding-bottom: 12px; }
  .sky { height: clamp(160px, 30vh, 260px); }
  .sheet .panel { left: 50%; right: auto; transform: translateX(-50%); width: min(92%, 640px); border-radius: 26px; bottom: 4%; border-bottom: var(--line) solid var(--ink-line); }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 700px) and (orientation: portrait) {
  .actions { grid-template-columns: 1fr 1fr 1fr; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@media (max-height: 720px) and (orientation: portrait) {
  .sky { height: clamp(96px, 17vh, 140px); }
  .clockrow { margin-top: calc(-1 * clamp(52px, 9vh, 70px)); padding-top: 4px; padding-bottom: 2px; }
  .clock { width: clamp(108px, 27vmin, 150px); }
  .digital .t { font-size: clamp(26px, 5.6vmin, 40px); }
  .bubble { min-height: 50px; font-size: .95em; padding-top: .35em; padding-bottom: .35em; }
  .avatar { width: 54px; height: 54px; font-size: 30px; }
  .meter { padding: 4px 8px; } .meter .segs i { height: 11px; } .wallet { padding: 4px 8px; }
  .places { padding: 6px 8px; gap: 5px; } .ptile { min-height: 52px; }
  .action { min-height: 60px; }
  .wishbox { padding: 3px 10px; } .wishbox .wname { display: none; } .wishbox .wemoji { font-size: 1.3em; } .wishbox .bar { margin-top: 0; height: 10px; }
  .action { min-height: 64px; padding: 6px 8px; }
  .action .ae { font-size: 28px; }
  .body { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .15s !important; }
  .clock.spin .hand { transition-duration: .8s !important; }
}

  const DAY_START = 7 * 60, BEDTIME = 21 * 60, BED_ALLOWED = 19 * 60, STEP = 30, SLOTS = (BEDTIME - DAY_START) / STEP;
  const TUMMY_MAX = 6, HAPPY_MAX = 10, WAKE_TUMMY = 2, WAKE_HAPPY = 7, HUNGER_PER_STEP = 0.25, WORK_PAY = 1 /* per hour */, WORK_HAPPY = -0.5 /* per hour */;
  const LATE_COINS = 1, LATE_HAPPY = 1; // arriving after the shift start: one coin less and a bit sad
  const SHIFTS = [{ start: 9 * 60, end: 13 * 60 }, { start: 13 * 60 + 30, end: 17 * 60 + 30 }];
  const LUNCH_FROM = 13 * 60, LUNCH_TO = 13 * 60 + 30; // the bakery's lunch break

  const PLACES = {
    home:   { emoji: '🏠', unlockDay: 1 },
    bakery: { emoji: '🥖', unlockDay: 1, open: 8 * 60, close: 18 * 60, weekdaysOnly: true },
    shops:  { emoji: '🏬', unlockDay: 1, open: 9 * 60, close: 18 * 60 },
    park:   { emoji: '🌳', unlockDay: 2 },
  };
  const TRAVEL = {
    walk: { emoji: '🚶', min: 60, cost: 0 },
    bus:  { emoji: '🚌', min: 30, cost: 1 },
    bike: { emoji: '🚲', min: 30, cost: 0, needs: 'bike' },
  };
  const ITEMS = {
    meals:    { emoji: '🧺', price: 5, stall: 'food', meals: 6 },
    raincoat: { emoji: '🧥', price: 3, stall: 'clothes', wear: true },
    jacket:   { emoji: '🧣', price: 4, stall: 'clothes', wear: true },
    hat:      { emoji: '🎩', price: 2, stall: 'clothes', wear: true, fun: true },
    ball:     { emoji: '⚽', price: 3, stall: 'toys' },
    teddy:    { emoji: '🧸', price: 5, stall: 'toys' },
    kite:     { emoji: '🪁', price: 8, stall: 'toys' },
    bike:     { emoji: '🚲', price: 12, stall: 'toys' },
    train:    { emoji: '🚂', price: 20, stall: 'toys' },
  };
  const STALL_UNLOCK = { food: 1, clothes: 4, toys: 3 };
  const SHOW_UNLOCK = 3, WEATHER_FROM = 4, FRIDGE_MAX = 20;
  const CAT_COLORS = { work: '#F6C445', travel: '#6EC1E4', eat: '#8BD17C', play: '#F58FB6', wait: '#D8CBB6', shop: '#C79BE8', sleep: '#3D4A7A' };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const weekday = (day) => (day - 1) % 7;          // 0 = Monday
  const isWeekend = (day) => weekday(day) >= 5;

  // The day's plan: where to be, hour by hour (hours may run past 24 for the night block).
  function routine(state) {
    const wk = isWeekend(state.day), park = state.day >= PLACES.park.unlockDay;
    const b = (id, from, to, cat, place, emoji) => ({ id, from, to, cat, place, emoji });
    const day = wk ? [
      b('breakfast', 7, 7.5, 'eat', 'home', '🍳'),
      b('free', 7.5, 9, 'play', 'home', '🧸'),
      park ? b('park', 9, 13, 'play', 'park', '🌳') : b('shops', 9, 13, 'shop', 'shops', '🏬'),
      b('lunch', 13, 13.5, 'eat', null, '🍱'),
      b('shops', 13.5, 15, 'shop', 'shops', '🏬'),
      park ? b('park', 15, 17.5, 'play', 'park', '🌳') : b('goHome', 15, 17.5, 'travel', 'home', '🏠'),
      b('goHome', 17.5, 18.5, 'travel', 'home', '🚶'),
      b('dinner', 18.5, 19, 'eat', 'home', '🍳'),
      b('free', 19, 21, 'play', 'home', '🧸'),
    ] : [
      b('breakfast', 7, 7.5, 'eat', 'home', '🍳'),
      b('pack', 7.5, 8, 'eat', 'home', '🍱'),
      b('goWork', 8, 9, 'travel', 'bakery', '🚶'),
      b('work', 9, 13, 'work', 'bakery', '🥖'),
      b('lunch', 13, 13.5, 'eat', null, '🍱'),
      b('work2', 13.5, 17.5, 'work', 'bakery', '🥖'),
      b('goHome', 17.5, 18.5, 'travel', 'home', '🚶'),
      b('dinner', 18.5, 19, 'eat', 'home', '🍳'),
      b('free', 19, 21, 'play', 'home', '🧸'),
    ];
    day.push(b('sleep', 21, 31, 'sleep', 'home', '😴'));
    return day;
  }
  const bandAt = (state, time) => routine(state).find(x => time >= x.from * 60 && time < x.to * 60) || null;
  function planHint(state, out) {
    if (state.time >= BEDTIME) return;
    const band = bandAt(state, state.time); if (!band) return;
    if (state.lastBand === band.id) return;
    state.lastBand = band.id;
    if (band.place && band.place !== state.loc) out.msgs.push({ key: 'plan', band: band.id });
    else if (!band.place) out.msgs.push({ key: 'plan', band: band.id }); // lunch: eat wherever you are
    else if (band.id === 'free' || band.id === 'pack') out.msgs.push({ key: 'plan', band: band.id });
  }

  function rng(state) { // mulberry32, deterministic per save
    let a = (state.seed = (state.seed + 0x6D2B79F5) | 0);
    let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function newGame(avatar, seed) {
    return {
      v: 3, avatar: avatar || '🐻', seed: seed || 12345,
      day: 1, time: DAY_START, coins: 2, loc: 'home',
      tummy: 3, happy: 7, fridge: 5, lunchbox: 0,
      wardrobe: {}, toys: [], wish: null, wishReadyTold: false,
      weather: 'sun', forecast: 'sun',
      timeline: [], today: freshToday(),
      flags: {}, phase: 'day', msgs: [], lastBand: 'breakfast',
      totals: { earned: 0, spent: 0 },
    };
  }
  const freshToday = () => ({ earned: 0, spent: 0 });

  function timeInfo(t) {
    const h = Math.floor(t / 60) % 24, m = t % 60;
    const part = h < 12 ? 'morning' : h < 18 ? 'afternoon' : h < 21 ? 'evening' : 'night';
    return { h, m, part, h12: h % 12 === 0 ? 12 : h % 12 };
  }

  function isOpen(state, place, at) {
    const p = PLACES[place]; const t = at == null ? state.time : at;
    if (!p) return false;
    if (p.weekdaysOnly && isWeekend(state.day)) return false;
    if (p.open == null) return true;
    return t >= p.open && t < p.close;
  }
  const unlocked = (state, place) => state.day >= PLACES[place].unlockDay;
  const stallOpen = (state, stall) => state.day >= STALL_UNLOCK[stall];
  const shiftAt = (time) => SHIFTS.find(s => time >= s.start && time < s.end) || null;
  const nextShift = (time) => SHIFTS.find(s => s.start > time) || null;

  // ---- time & needs ----
  function advance(state, minutes, cat, out) {
    const from = state.time;
    for (let i = 0; i < minutes / STEP; i++) {
      const slot = (state.time - DAY_START) / STEP;
      if (slot >= 0 && slot < SLOTS) state.timeline[slot] = cat;
      state.time += STEP;
      state.tummy = clamp(state.tummy - HUNGER_PER_STEP, 0, TUMMY_MAX);
    }
    out.steps.push({ cat, from, to: state.time });
  }
  function needHints(state, out) {
    if (state.time >= BEDTIME) return; // bedtime message takes over
    let hinted = false;
    if (state.tummy <= 0 && !state.flags.hStarving) { out.msgs.push({ key: 'starving' }); state.flags.hStarving = true; hinted = true; }
    else if (state.tummy <= 1 && state.tummy > 0 && !state.flags.hHungry) { out.msgs.push({ key: 'hungry' }); state.flags.hHungry = true; hinted = true; }
    if (!hinted && state.happy <= 0 && !state.flags.hSad) { out.msgs.push({ key: 'tooSad' }); state.flags.hSad = true; hinted = true; }
    else if (!hinted && state.happy <= 2 && state.happy > 0 && !state.flags.hBored) { out.msgs.push({ key: 'bored' }); state.flags.hBored = true; hinted = true; }
    if (!hinted && state.wish && state.coins >= ITEMS[state.wish].price && !state.wishReadyTold) {
      out.msgs.push({ key: 'wishReady', item: state.wish }); state.wishReadyTold = true;
    }
  }
  function ate(state, amount) { state.tummy = clamp(state.tummy + amount, 0, TUMMY_MAX); state.flags.hHungry = false; state.flags.hStarving = false; }
  function cheer(state, amount) { state.happy = clamp(state.happy + amount, 0, HAPPY_MAX); if (amount > 0) { state.flags.hBored = false; state.flags.hSad = false; } }
  function pay(state, n, out) { state.coins -= n; state.today.spent += n; state.totals.spent += n; out.coins -= n; }
  function earn(state, n, out) { if (!n) return; state.coins += n; state.today.earned += n; state.totals.earned += n; out.coins += n; }

  function checkBedtime(state, out) {
    if (state.time >= BEDTIME && state.phase === 'day') {
      out.msgs = out.msgs.filter(m => m.key !== 'rested');
      if (state.loc !== 'home') { out.msgs.push({ key: 'late' }); advance(state, 60, 'travel', out); state.loc = 'home'; }
      else out.msgs.push({ key: 'bedtime' });
      state.phase = 'summary'; out.bedtime = true;
    }
  }

  // ---- actions ----
  function actions(state) {
    const list = [], s = state, wk = isWeekend(s.day);
    const openNow = isOpen(s, s.loc);
    const closedMsg = () => PLACES[s.loc].weekdaysOnly && wk ? { key: 'closedToday', place: s.loc } : { key: 'closed', place: s.loc, t: PLACES[s.loc].open };
    const hungryBlock = s.tummy <= 0 ? { key: 'starving' } : null;
    const sadBlock = s.happy <= 0 ? { key: 'tooSad' } : null;
    const add = (a) => { list.push(Object.assign({ enabled: true, cost: 0, earn: 0, minutes: 0, tummy: 0, happy: 0, fridge: 0 }, a)); };
    const lunchBreak = s.time >= LUNCH_FROM && s.time < LUNCH_TO;

    if (s.loc === 'home') {
      add({ id: 'cook', emoji: '🍳', cat: 'eat', minutes: 30, tummy: 4, happy: 1, fridge: -1, enabled: s.fridge > 0, why: s.fridge > 0 ? null : { key: 'noMeals' } });
      if (!wk && !s.lunchbox) add({ id: 'pack', emoji: '🍱', cat: 'eat', minutes: 30, fridge: -1, enabled: s.fridge > 0, why: s.fridge > 0 ? null : { key: 'noMeals' } });
      if (s.toys.length) add({ id: 'toy', emoji: ITEMS[s.toys[s.toys.length - 1]].emoji, cat: 'play', minutes: 60, happy: 2, enabled: !hungryBlock, why: hungryBlock });
      else if (s.day >= STALL_UNLOCK.toys) add({ id: 'toy', emoji: '🧸', cat: 'play', minutes: 60, happy: 2, enabled: false, why: { key: 'noToy' } });
    }
    if (s.loc === 'bakery') {
      const shift = shiftAt(s.time), next = nextShift(s.time);
      let work;
      if (!openNow) work = { enabled: false, why: closedMsg() };
      else if (lunchBreak) work = { enabled: false, why: { key: 'lunchBreak' } };
      else if (shift) {
        const minutes = shift.end - s.time, hours = minutes / 60, late = s.time > shift.start;
        work = { enabled: !hungryBlock && !sadBlock, why: hungryBlock || sadBlock, minutes, until: shift.end, late,
                 earn: Math.max(0, Math.ceil(hours) * WORK_PAY - (late ? LATE_COINS : 0)),
                 happy: -(Math.round(hours * -WORK_HAPPY) || 1) - (late ? LATE_HAPPY : 0) };
      } else if (next) work = { enabled: false, why: { key: 'shiftStarts', t: next.start }, until: next.start };
      else work = { enabled: false, why: { key: 'shiftOver' } };
      add(Object.assign({ id: 'work', emoji: '🥖', cat: 'work' }, work));
      add({ id: 'cafe', emoji: '🍲', cat: 'eat', minutes: 30, cost: 2, tummy: 4, happy: 1, enabled: openNow && s.coins >= 2, why: !openNow ? closedMsg() : { key: 'notEnough', n: 2 - s.coins } });
    }
    if (s.lunchbox) add({ id: 'lunchbox', emoji: '🍱', cat: 'eat', minutes: 30, tummy: 4, happy: 1 });
    if (s.loc === 'shops') {
      add({ id: 'shop', emoji: '🛒', cat: 'shop', minutes: 30, enabled: openNow, why: openNow ? null : closedMsg(), sheet: true });
      add({ id: 'restaurant', emoji: '🍝', cat: 'eat', minutes: 30, cost: 2, tummy: 4, happy: 1, enabled: openNow && s.coins >= 2, why: !openNow ? closedMsg() : { key: 'notEnough', n: 2 - s.coins } });
    }
    if (s.loc === 'park') {
      add({ id: 'play', emoji: '🛝', cat: 'play', minutes: 60, happy: 3, enabled: !hungryBlock, why: hungryBlock });
      add({ id: 'icecream', emoji: '🍦', cat: 'eat', minutes: 30, cost: 1, happy: 1, tummy: 1, enabled: s.coins >= 1, why: { key: 'notEnough', n: 1 - s.coins } });
      if (s.day >= SHOW_UNLOCK) add({ id: 'show', emoji: '🎭', cat: 'play', minutes: 60, cost: 2, happy: 4, enabled: s.coins >= 2, why: { key: 'notEnough', n: 2 - s.coins } });
    }
    add({ id: 'rest', emoji: '😌', cat: 'wait', minutes: 30, happy: 1 });
    if (s.loc === 'home') add({ id: 'bed', emoji: '🛏️', cat: 'sleep', enabled: s.time >= BED_ALLOWED, hidden: s.time < BED_ALLOWED });
    return list.filter(a => !a.hidden);
  }

  function perform(state, id) {
    const out = { ok: false, msgs: [], steps: [], coins: 0, bedtime: false };
    if (state.phase !== 'day') return out;
    const a = actions(state).find(x => x.id === id);
    if (!a || !a.enabled) { if (a && a.why) out.msgs.push(a.why); return out; }
    out.ok = true;
    switch (id) {
      case 'cook': state.fridge -= 1; advance(state, 30, 'eat', out); ate(state, 4); cheer(state, 1); out.msgs.push({ key: 'ate' }); break;
      case 'pack': state.fridge -= 1; state.lunchbox = 1; advance(state, 30, 'eat', out); out.msgs.push({ key: 'packed' }); break;
      case 'lunchbox': state.lunchbox = 0; advance(state, 30, 'eat', out); ate(state, 4); cheer(state, 1); out.msgs.push({ key: 'lunchbox' }); break;
      case 'cafe': pay(state, 2, out); advance(state, 30, 'eat', out); ate(state, 4); cheer(state, 1); out.msgs.push({ key: 'cafe' }); break;
      case 'toy': advance(state, 60, 'play', out); cheer(state, 2); out.msgs.push({ key: 'played' }); break;
      case 'work': {
        const late = a.late, minutes = a.minutes;
        advance(state, minutes, 'work', out); earn(state, a.earn, out); cheer(state, a.happy);
        out.msgs.push({ key: state.flags.firstWork ? 'worked' : 'workedFirst', d: minutes, n: a.earn, k: Math.round(minutes / 60), t: a.until });
        if (late) out.msgs.push({ key: 'wasLate' });
        state.flags.firstWork = true; break;
      }
      case 'restaurant': pay(state, 2, out); advance(state, 30, 'eat', out); ate(state, 4); cheer(state, 1); out.msgs.push({ key: 'ate' }); break;
      case 'play': advance(state, 60, 'play', out); cheer(state, 3); out.msgs.push({ key: 'played' }); break;
      case 'icecream': pay(state, 1, out); advance(state, 30, 'eat', out); ate(state, 1); cheer(state, 1); out.msgs.push({ key: 'icecream' }); break;
      case 'show': pay(state, 2, out); advance(state, 60, 'play', out); cheer(state, 4); out.msgs.push({ key: 'show' }); break;
      case 'rest': advance(state, 30, 'wait', out); cheer(state, 1); out.msgs.push({ key: 'rested', t: state.time }); break;
      case 'bed': out.msgs.push({ key: 'goBed' }); state.phase = 'summary'; out.bedtime = true; return out;
      default: out.ok = false; return out;
    }
    needHints(state, out);
    planHint(state, out);
    checkBedtime(state, out);
    return out;
  }

  function travelOptions(state, dest) {
    return Object.keys(TRAVEL).map(mode => {
      const t = TRAVEL[mode];
      const owned = !t.needs || state.toys.includes(t.needs);
      return { mode, emoji: t.emoji, minutes: t.min, cost: t.cost, enabled: owned && state.coins >= t.cost, hidden: !owned, why: state.coins < t.cost ? { key: 'notEnough', n: t.cost - state.coins } : null };
    }).filter(o => !o.hidden);
  }
  function destinations(state) {
    return Object.keys(PLACES).filter(p => unlocked(state, p)).map(p => ({
      id: p, emoji: PLACES[p].emoji, here: p === state.loc, open: isOpen(state, p),
      opensAt: PLACES[p].open, closedToday: PLACES[p].weekdaysOnly && isWeekend(state.day), always: PLACES[p].open == null,
    }));
  }
  function travel(state, dest, mode) {
    const out = { ok: false, msgs: [], steps: [], coins: 0, bedtime: false };
    if (state.phase !== 'day' || dest === state.loc || !unlocked(state, dest)) return out;
    const opt = travelOptions(state).find(o => o.mode === mode);
    if (!opt || !opt.enabled) { if (opt && opt.why) out.msgs.push(opt.why); return out; }
    out.ok = true;
    if (opt.cost) pay(state, opt.cost, out);
    advance(state, opt.minutes, 'travel', out);
    state.loc = dest;
    out.msgs.push({ key: 'arrived', place: dest });
    if (mode !== 'bus') {
      if (state.weather === 'rain' && !state.wardrobe.raincoat) { cheer(state, -2); out.msgs.push({ key: 'wet' }); }
      if (state.weather === 'cold' && !state.wardrobe.jacket) { cheer(state, -2); out.msgs.push({ key: 'cold' }); }
    }
    if (mode === 'bike' && !state.flags.bikeTold) { out.msgs.push({ key: 'bikeTravel' }); state.flags.bikeTold = true; }
    needHints(state, out);
    planHint(state, out);
    checkBedtime(state, out);
    return out;
  }

  function catalogue(state, stall) {
    return Object.keys(ITEMS).filter(k => ITEMS[k].stall === stall).map(k => {
      const it = ITEMS[k];
      const owned = stall === 'clothes' ? !!state.wardrobe[k] : stall === 'toys' ? state.toys.includes(k) : false;
      const full = k === 'meals' && state.fridge + it.meals > FRIDGE_MAX;
      return { id: k, emoji: it.emoji, price: it.price, owned, full, canAfford: state.coins >= it.price, wished: state.wish === k,
               enabled: !owned && !full && state.coins >= it.price };
    });
  }
  function buy(state, item) {
    const out = { ok: false, msgs: [], steps: [], coins: 0, bedtime: false, bought: null };
    if (state.phase !== 'day' || state.loc !== 'shops' || !isOpen(state, 'shops')) return out;
    const it = ITEMS[item]; if (!it || !stallOpen(state, it.stall)) return out;
    const entry = catalogue(state, it.stall).find(c => c.id === item);
    if (!entry.enabled) { if (!entry.canAfford) out.msgs.push({ key: 'notEnough', n: it.price - state.coins }); return out; }
    out.ok = true; out.bought = item;
    pay(state, it.price, out);
    advance(state, 30, 'shop', out);
    if (item === 'meals') { state.fridge += it.meals; out.msgs.push({ key: 'boughtMeals' }); }
    else if (it.stall === 'clothes') { state.wardrobe[item] = true; out.msgs.push({ key: 'bought', item }); if (it.fun) cheer(state, 1); }
    else { state.toys.push(item); cheer(state, 2);
      if (state.wish === item) { state.wish = null; state.wishReadyTold = false; out.msgs.push({ key: 'wishBought', item }); }
      else out.msgs.push({ key: 'bought', item }); }
    needHints(state, out);
    planHint(state, out);
    checkBedtime(state, out);
    return out;
  }
  function setWish(state, item) {
    const out = { ok: false, msgs: [] };
    if (!ITEMS[item] || ITEMS[item].stall !== 'toys' || state.toys.includes(item)) return out;
    state.wish = item; state.wishReadyTold = state.coins >= ITEMS[item].price; out.ok = true;
    out.msgs.push({ key: state.wishReadyTold ? 'wishReady' : 'wishSet', item, n: ITEMS[item].price });
    return out;
  }

  // ---- day / night ----
  function summary(state) {
    const byCat = {}; state.timeline.forEach(c => { if (c) byCat[c] = (byCat[c] || 0) + STEP; });
    byCat.sleep = (24 * 60) - (BEDTIME - DAY_START);
    return { day: state.day, weekday: weekday(state.day), earned: state.today.earned, spent: state.today.spent,
             kept: state.today.earned - state.today.spent, wallet: state.coins, byCat, forecast: state.forecast,
             timeline: state.timeline.slice(0, SLOTS), showForecast: state.day + 1 >= WEATHER_FROM };
  }
  function rollForecast(state) {
    if (state.day + 1 < WEATHER_FROM) return 'sun';
    if (state.day + 1 === WEATHER_FROM) return 'rain';
    const r = rng(state); return r < 0.5 ? 'sun' : r < 0.75 ? 'rain' : 'cold';
  }
  function goToSleep(state) { // summary -> night
    if (state.phase !== 'summary') return false;
    state.forecast = rollForecast(state);
    state.phase = 'night'; return true;
  }
  function wakeUp(state) { // night -> new day
    if (state.phase !== 'night') return null;
    state.day += 1; state.time = DAY_START; state.loc = 'home';
    state.tummy = WAKE_TUMMY; state.happy = clamp(Math.max(WAKE_HAPPY, state.happy), 0, HAPPY_MAX);
    state.weather = state.forecast; state.timeline = []; state.today = freshToday(); state.lunchbox = 0;
    state.flags.hHungry = state.flags.hStarving = state.flags.hBored = state.flags.hSad = false;
    state.phase = 'day';
    const msgs = [{ key: 'morning', day: state.day }];
    if (isWeekend(state.day)) msgs.push({ key: 'weekendMorning' });
    if (state.day === PLACES.park.unlockDay) msgs.push({ key: 'newPark' });
    if (state.day === STALL_UNLOCK.toys) msgs.push({ key: 'newToys' });
    if (state.day === STALL_UNLOCK.clothes) msgs.push({ key: 'newClothes' });
    if (state.weather === 'rain' && !state.wardrobe.raincoat) msgs.push({ key: 'weatherRain' });
    if (state.weather === 'cold' && !state.wardrobe.jacket) msgs.push({ key: 'weatherCold' });
    const first = routine(state)[0].id; state.lastBand = first; msgs.push({ key: 'plan', band: first });
    return msgs;
  }

  return { DAY_START, BEDTIME, STEP, SLOTS, TUMMY_MAX, HAPPY_MAX, PLACES, TRAVEL, ITEMS, CAT_COLORS, STALL_UNLOCK, FRIDGE_MAX, LUNCH_FROM, LUNCH_TO, WORK_PAY, SHIFTS, HUNGER_PER_STEP,
           newGame, timeInfo, isOpen, isWeekend, weekday, unlocked, stallOpen, actions, perform, travelOptions, destinations,
           travel, catalogue, buy, setWish, summary, goToSleep, wakeUp, routine, bandAt, shiftAt };
})();
if (typeof module !== 'undefined') module.exports = TSEngine;

/* ===== TimeSpent — UI layer ===== */
(() => {
  const E = TSEngine;

      let chips = '';
      if (a.minutes) chips += timeDiscs(a.minutes);
      chips += effChip('🍎', a.tummy) + effChip('😊', a.happy) + effChip('🧺', a.fridge) + effChip(COIN_ICO, (a.earn || 0) - (a.cost || 0));
      if (a.id === 'work' && a.late && a.enabled) chips += `<span class="cchip spend">⏰ ${Lx.late}</span>`;
      if (a.id === 'shop') chips = `<span class="mchip">${['food', 'clothes', 'toys'].filter(st => E.stallOpen(S, st)).map(st => ({ food: '🥕', clothes: '🧥', toys: '🧸' })[st]).join(' ')}</span>` + chips;
      const why = !a.enabled && a.why ? `<div class="why">${whyShort(a.why)}</div>` : '';
      html += `<div role="button" tabindex="0" class="${cls.join(' ')}" data-act="${a.id}" data-min="${a.enabled && a.minutes ? a.minutes : 0}" data-cat="${a.cat}" aria-disabled="${!a.enabled}"><span class="ae">${a.emoji}</span><span class="txt"><span class="al">${label}</span><span class="ac">${chips}</span>${why}</span></div>`;
    });
    $('actions').innerHTML = html;
  }
  function renderAll() {
    renderTop(); renderTime(S.time); renderMeters(); renderWallet($('wallet'), $('coinCount'), $('coinstack')); renderWish(); renderAvatar(); renderPlace();
    setSky(S.time, 0.3); shownTime = absMin(S.day, S.time); setClock('c', shownTime, false);
    $('bubbleText').textContent = msgsText(S.msgs);
  }

  // ---------- bubble ----------
  function bubble(msgs, opts) {
    const text = typeof msgs === 'string' ? msgs : msgsText(msgs);
    if (!text) return; S.msgs = typeof msgs === 'string' ? [] : msgs; $('bubbleText').textContent = text;
    const av = $('avatar'); av.classList.remove('bounce'); void av.offsetWidth; av.classList.add('bounce');
    if (!(opts && opts.quiet)) speak(text);
  }
  function toast(text) { const el = $('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(toast.tm); toast.tm = setTimeout(() => el.classList.remove('show'), 1800); }

  // ---------- coin flight ----------
  function flyCoins(n, fromEl, toEl, done) {
    const fx = $('fx'); const count = Math.min(Math.abs(n), 6); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!fromEl || !toEl || !count || reduce || !fx.animate) { if (done) done(); return; }
    const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect(), root = fx.getBoundingClientRect();
    const sx = fr.left + fr.width / 2 - root.left - 12, sy = fr.top + fr.height / 2 - root.top - 12, tx = tr.left + tr.width / 2 - root.left - 12, ty = tr.top + tr.height / 2 - root.top - 12;
    let finished = 0;
    for (let i = 0; i < count; i++) {
      const c = document.createElement('span'); c.className = 'coin'; fx.appendChild(c);
      const dx = (Math.random() - .5) * 40, dy = -40 - Math.random() * 40;
      const anim = c.animate([{ transform: `translate(${sx}px, ${sy}px) scale(.6)`, opacity: 0 }, { transform: `translate(${sx + dx}px, ${sy + dy}px) scale(1.15)`, opacity: 1, offset: .35 }, { transform: `translate(${tx}px, ${ty}px) scale(.9)`, opacity: 1 }],
        { duration: 520, delay: i * 70, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
      anim.onfinish = () => { c.remove(); if (++finished === count && done) done(); };
    }
  }

  // ---------- performing actions ----------
  function animateTime(fromAbs, toAbs, steps) {
    return new Promise(res => {
      const n = Math.max(1, Math.round((toAbs - fromAbs) / E.STEP)); const dur = Math.min(0.4 * n, 2.0);
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      ['cHour', 'cMin'].forEach(id => { $(id).style.transition = `transform ${reduce ? .2 : dur}s cubic-bezier(.45,0,.35,1)`; });
      setClock('c', toAbs, true); shownTime = toAbs;
      const time = toAbs - (S.day - 1) * 1440; setSky(time, dur);
      for (let i = 1; i <= n; i++) setTimeout(() => { SFX.tick(); const tt = time - (n - i) * E.STEP; $('digital').textContent = fmtTime(tt); const inf = E.timeInfo(tt); $('partTxt').textContent = L().partOfDay[inf.part]; $('partIco').textContent = PART_EMOJI[inf.part];
        const slot = (tt - E.DAY_START) / E.STEP; renderDayBar($('daybar'), S.timeline.slice(0, Math.max(0, slot)), tt, E.routine(S)); }, (i / n) * dur * 1000);
      setTimeout(res, dur * 1000 + 80);
    });
  }
  async function applyResult(out, srcEl) {
    if (!out.ok) { if (out.msgs.length) { bubble(out.msgs); SFX.sad(); } return; }
    busy = true; $('app').classList.add('busy');
    const before = shownTime;
    if (out.coins < 0) { SFX.spend(); const wallet = $('wallet'); flyCoins(out.coins, wallet, srcEl || $('avatar')); renderWallet(wallet, $('coinCount'), $('coinstack')); }
    if (out.steps.length) await animateTime(before, absMin(S.day, S.time), out.steps);
    renderTime(S.time); renderMeters();
    if (out.coins > 0) { SFX.coin(); await new Promise(r => flyCoins(out.coins, srcEl || $('avatar'), $('wallet'), r)); const w = $('wallet'); w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop'); }
    renderWallet($('wallet'), $('coinCount'), $('coinstack')); renderWish(); renderAvatar(); renderPlace(); renderTop();
    const keys = out.msgs.map(m => m.key);
    if (keys.some(k => ['ate', 'cafe', 'lunchbox', 'icecream', 'boughtMeals'].includes(k))) SFX.eat();
    if (keys.some(k => ['played', 'show', 'wishBought', 'bought'].includes(k))) SFX.happy();
    if (keys.some(k => ['wet', 'cold', 'starving', 'tooSad'].includes(k))) SFX.sad();
    bubble(out.msgs);
    save();
    busy = false; $('app').classList.remove('busy');
    if (out.bedtime) setTimeout(showSummary, keys.includes('late') ? 2600 : 1900);
  }
  function doAction(id, el) {
    if (busy || !S || S.phase !== 'day') return;
    SFX.tap();
    if (id === 'shop') { const a = E.actions(S).find(x => x.id === 'shop'); if (!a.enabled) { bubble([a.why]); SFX.sad(); return; } openShop(); return; }
    applyResult(E.perform(S, id), el);
  }

  // ---------- travel sheet (opens for a chosen place) ----------
  let travelDest = null, lastModes = {};
  function openTravelTo(dest) {
    travelDest = dest; const Lx = L();
    $('travelTitle').textContent = Lx.travel.title;
    $('travelDest').innerHTML = `${E.PLACES[dest].emoji} ${Lx.places[dest]}${Lx.placeSub[dest] ? ` <span class="psub">· ${Lx.placeSub[dest]}</span>` : ''}`;
    let html = '';
    lastModes = {};
    E.travelOptions(S).forEach(o => {
      lastModes[o.mode] = { minutes: o.minutes, cat: 'travel', cost: o.cost };
      const outdoors = o.mode !== 'bus';
      const warn = outdoors && S.weather === 'rain' && !S.wardrobe.raincoat ? `<span class="mchip">🌧️💧</span>` : outdoors && S.weather === 'cold' && !S.wardrobe.jacket ? `<span class="mchip">❄️🥶</span>` : '';
      const why = !o.enabled && o.why ? `<div class="why">${whyShort(o.why)}</div>` : '';
      html += `<div role="button" tabindex="0" class="action${o.enabled ? '' : ' disabled'}" data-mode="${o.mode}" data-min="${o.enabled ? o.minutes : 0}" data-cat="travel" aria-disabled="${!o.enabled}"><span class="ae">${o.emoji}</span><span class="txt"><span class="al">${Lx.travel[o.mode]}</span><span class="ac">${timeDiscs(o.minutes)}${o.cost ? effChip(COIN_ICO, -o.cost) : `<span class="cchip free">✓</span>`}${warn}</span>${why}</span></div>`;
    });
    $('travelModes').innerHTML = html;
    $('travelSheet').classList.add('open'); SFX.open();
  }
  function doTravel(mode, el) {
    const out = E.travel(S, travelDest, mode);
    if (!out.ok) { if (out.msgs.length) { bubble(out.msgs); SFX.sad(); } return; }
    closeSheet('travelSheet'); applyResult(out, $('places'));
  }

  // ---------- shop sheet ----------
  let stall = 'food';
  function openShop() {
    const stalls = ['food', 'clothes', 'toys'].filter(s => E.stallOpen(S, s)); if (!stalls.includes(stall)) stall = stalls[0];
    $('stallTabs').innerHTML = stalls.map(s => `<button role="tab" data-stall="${s}" aria-selected="${s === stall}">${{ food: '🥕', clothes: '🧥', toys: '🧸' }[s]} ${t('stalls.' + s)}</button>`).join('');
    renderStall(); $('shopSheet').classList.add('open'); SFX.open();
  }
  function renderStall() {
    const Lx = L(); renderWallet(null, $('shopCoins'), null);
    let html = '';
    E.catalogue(S, stall).forEach(c => {
      let btn;
      if (c.owned) btn = `<span class="tbtn got">✓ ${Lx.shop.got}</span>`;
      else if (c.full) btn = `<span class="tbtn need">${Lx.shop.fridgeFull}</span>`;
      else if (!c.canAfford) btn = `<button class="tbtn need" data-buy="${c.id}">${fmt(Lx.shop.needMore, { n: c.price - S.coins })}</button>`;
      else btn = `<button class="tbtn" data-buy="${c.id}">${Lx.shop.buy}</button>`;
      const wish = stall === 'toys' && !c.owned ? `<button class="tbtn wish${c.wished ? ' on' : ''}" data-wish="${c.id}">⭐ ${c.wished ? Lx.shop.wishing : Lx.shop.wishBtn}</button>` : '';
      const extra = c.id === 'meals' ? `<span class="ts">${Lx.fridge}: ${'🍎'.repeat(Math.min(S.fridge, 6)) || '—'}</span>` : '';
      html += `<div class="tile${c.owned || c.full ? ' disabled' : ''}">${c.wished ? `<span class="badge">⭐</span>` : ''}<span class="te">${c.emoji}</span><span class="tl">${Lx.items[c.id]}</span><span class="price"><span class="coin lg"></span>${c.price}</span>${extra}${btn}${wish}</div>`;
    });
    $('stallItems').innerHTML = html;
  }
  function doBuy(item, el) {
    const out = E.buy(S, item);
    if (!out.ok) { if (out.msgs.length) { bubble(out.msgs); SFX.sad(); } return; }
    SFX.buy(); closeSheet('shopSheet'); applyResult(out, $('places'));
  }
  function doWish(item) { const out = E.setWish(S, item); if (out.ok) { SFX.happy(); renderStall(); renderWish(); bubble(out.msgs); save(); } }

  function closeSheet(id) { $(id).classList.remove('open'); }

  // ---------- day / night ----------
  function showSummary() {
    if (!S || S.phase !== 'summary') return;
    const sum = E.summary(S); const Lx = L();
    $('sumTitle').textContent = fmt(Lx.summary.title, { n: sum.day });
    renderDayBar($('sumBar'), sum.timeline, null, E.routine(S));
    const order = ['work', 'travel', 'eat', 'play', 'shop', 'wait', 'sleep'];
    $('sumLegend').innerHTML = order.filter(c => sum.byCat[c]).map(c => `<div${c === 'sleep' ? ' class="wide"' : ''}><span class="sw" style="background:${E.CAT_COLORS[c]}"></span><span>${Lx.cats[c]}</span>${timeDiscs(sum.byCat[c])}</div>`).join('');
    $('sumEarned').innerHTML = `<span class="coin lg"></span>+${sum.earned}`; $('sumSpent').innerHTML = `<span class="coin lg"></span>−${sum.spent}`;
    $('sumKept').innerHTML = `<span class="coin lg"></span>${sum.kept >= 0 ? '+' : '−'}${Math.abs(sum.kept)}`; $('sumWallet').textContent = sum.wallet;
    const f = $('sumForecast'); f.classList.toggle('hidden', !sum.showForecast);
    f.querySelector('.fe').textContent = WEATHER_EMOJI[sum.forecast]; f.querySelector('.ft').textContent = fmt(Lx.summary.forecast, { w: Lx.weather[sum.forecast] });
    save(); $('summary').classList.add('open');
    speak(fmt(Lx.summary.title, { n: sum.day }));
  }
  function goToSleep() {
    if (!E.goToSleep(S)) return;
    save(); $('summary').classList.remove('open');
    const night = $('night'); night.classList.add('open');
    $('nightClock').innerHTML = clockSVG('n'); setClock('n', absMin(S.day, E.BEDTIME), false);
    SFX.sleep(); speak(t('night'));
    setTimeout(() => { const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; ['nHour', 'nMin'].forEach(id => $(id).style.transition = `transform ${reduce ? .8 : 4.2}s cubic-bezier(.4,0,.2,1)`); setClock('n', absMin(S.day + 1, E.DAY_START), true); }, 350);
    setTimeout(() => {
      const msgs = E.wakeUp(S); S.msgs = msgs; save();
      renderAll(); setSky(S.time, 0.1);
      night.classList.remove('open');
      const Lx = L(); $('mDay').textContent = `${fmt(Lx.dayN, { n: S.day })} · ${Lx.weekdays[E.weekday(S.day)]}`;
      $('mWeather').querySelector('.fe').textContent = WEATHER_EMOJI[S.weather]; $('mWeather').querySelector('.ft').textContent = Lx.weather[S.weather];
      $('mText').textContent = msgsText(msgs.slice(1, 3));
      $('morning').classList.add('open'); SFX.morning(); speak(`${Lx.morning} ${msgsText(msgs)}`);
    }, 5200);
  }
  function wake() { $('morning').classList.remove('open'); bubble(S.msgs, { quiet: true }); }

  // ---------- start screen ----------
  function renderStart() {
    applyI18n();
    $('startClock').innerHTML = clockSVG('s'); setClock('s', 420, false);
    $('avatars').innerHTML = AVATARS.map(a => `<button class="avatar-btn" data-avatar="${a}" aria-pressed="${a === settings.avatar}">${a}</button>`).join('');
    const hasSave = !!store.get(SAVE_KEY);
    $('btnContinue').classList.toggle('hidden', !hasSave); $('btnPlay').classList.toggle('hidden', hasSave); $('btnNew').classList.toggle('hidden', !hasSave); $('newConfirm').classList.add('hidden');
    $('app').dataset.screen = 'start';
  }
  function migrate(s) { // older saves (v1: hourly work + car wash; v2: happy max 6, fridge max 12)
    if (s.v < 2) { s.lunchbox = s.lunchbox || 0; delete s.carwash; s.lastBand = s.lastBand || 'breakfast'; if (s.phase === 'day' && s.time >= E.BEDTIME) s.phase = 'summary'; }
    if (s.v < 3) { s.happy = Math.min(E.HAPPY_MAX, (s.happy || 0) + 2); }
    s.v = 3;
    return s;
  }
  function startGame(fresh) {
    const saved = fresh ? null : store.get(SAVE_KEY);
    if (saved && saved.v >= 1 && saved.day) { S = migrate(saved); }
    else { S = E.newGame(settings.avatar, (Date.now() % 100000) | 0); S.msgs = [{ key: 'morning', day: 1 }, { key: 'plan', band: E.routine(S)[0].id }]; }
    applyI18n(); renderAll(); $('app').dataset.screen = 'game'; save();
    if (S.phase === 'summary') showSummary();
    else if (S.phase === 'night') { S.phase = 'summary'; showSummary(); }
    else bubble(S.msgs);
  }
  function resetGame() { store.del(SAVE_KEY); S = null; closeSheet('settings'); $('resetConfirm').classList.add('hidden'); renderStart(); }

  // ---------- events ----------
  document.addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button') { ev.preventDefault(); ev.target.click(); } });
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button, [role="button"], [data-close]'); if (!b) return;
    if (b.dataset.close) { closeSheet(b.dataset.close); SFX.tap(); return; }
    if (b.dataset.lang) { settings.lang = b.dataset.lang; saveSettings(); applyI18n(); relabelBeads(); if (S) renderAll(); else renderStart(); return; }
    if (b.dataset.avatar) { settings.avatar = b.dataset.avatar; saveSettings(); document.querySelectorAll('.avatar-btn').forEach(x => x.setAttribute('aria-pressed', x.dataset.avatar === settings.avatar)); SFX.happy(); speak(''); return; }
    if (b.id === 'btnPlay') { SFX.tap(); startGame(true); return; }
    if (b.id === 'btnContinue') { SFX.tap(); startGame(false); return; }
    if (b.id === 'btnNew') { SFX.tap(); $('newConfirm').classList.remove('hidden'); b.classList.add('hidden'); return; }
    if (b.id === 'btnNewYes') { SFX.tap(); startGame(true); return; }
    if (b.id === 'btnNewNo') { SFX.tap(); $('newConfirm').classList.add('hidden'); $('btnNew').classList.remove('hidden'); return; }
    if (b.dataset.act) { doAction(b.dataset.act, b); return; }
    if (b.dataset.place) { if (busy || !S || S.phase !== 'day') return; SFX.tap(); if (b.dataset.place === S.loc) { bubble([{ key: 'arrived', place: S.loc }]); return; } openTravelTo(b.dataset.place); return; }
    if (b.dataset.band) { SFX.tap(); const band = E.routine(S).find(x => x.id === b.dataset.band); if (band) { const Lx = L(); const a = sayTime(band.from * 60), bb = sayTime((band.to % 24) * 60); speak(fmt(Lx.planSay, { a, b: bb, what: Lx.plan[band.id] })); toast(`${band.emoji} ${Lx.plan[band.id]}`); } return; }
    if (b.dataset.mode) { if (busy) return; SFX.tap(); doTravel(b.dataset.mode, b); return; }
    if (b.dataset.stall) { SFX.tap(); stall = b.dataset.stall; document.querySelectorAll('#stallTabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.stall === stall)); renderStall(); return; }
    if (b.dataset.buy) { if (busy) return; doBuy(b.dataset.buy, b); return; }
    if (b.dataset.wish) { SFX.tap(); doWish(b.dataset.wish); return; }
    if (b.id === 'speakBtn') { SFX.tap(); const on = settings.voice; if (!on) { settings.voice = true; saveSettings(); applyI18n(); } speak($('bubbleText').textContent); return; }
    if (b.id === 'btnSleep') { SFX.tap(); goToSleep(); return; }
    if (b.id === 'btnWake') { SFX.tap(); wake(); return; }
    if (b.parentElement && b.parentElement.id === 'setLang') { settings.lang = b.dataset.v; saveSettings(); applyI18n(); relabelBeads(); if (S) renderAll(); return; }
    if (b.parentElement && b.parentElement.id === 'setClock') { settings.clock24 = b.dataset.v === '24'; saveSettings(); applyI18n(); relabelBeads(); if (S) renderAll(); return; }
    if (b.parentElement && b.parentElement.id === 'setSound') { settings.sound = b.dataset.v === '1'; saveSettings(); applyI18n(); return; }
    if (b.parentElement && b.parentElement.id === 'setVoice') { settings.voice = b.dataset.v === '1'; saveSettings(); applyI18n(); if (!settings.voice && window.speechSynthesis) speechSynthesis.cancel(); return; }
    if (b.id === 'btnReset') { $('resetConfirm').classList.remove('hidden'); return; }
    if (b.id === 'btnResetNo') { $('resetConfirm').classList.add('hidden'); return; }
    if (b.id === 'btnResetYes') { resetGame(); return; }
  });

  // preview: hovering or pressing a card shows its time on the day bar and its effects on the meters
  (() => {
    const from = (ev) => ev.target.closest && ev.target.closest('[data-min]');
    const on = (ev) => { const el = from(ev); if (!el) return; if (+el.dataset.min <= 0) return;
      const eff = el.dataset.act ? lastActions[el.dataset.act] : el.dataset.mode ? lastModes[el.dataset.mode] : null;
      if (eff && eff.enabled !== false) showPreview(eff); };
    document.addEventListener('pointerover', on);
    document.addEventListener('pointerdown', on);
    document.addEventListener('pointerout', (ev) => { const el = from(ev); if (el && !(ev.relatedTarget && el.contains(ev.relatedTarget))) clearPreview(); });
    document.addEventListener('pointerup', clearPreview); document.addEventListener('pointercancel', clearPreview);
    document.addEventListener('focusin', on); document.addEventListener('focusout', clearPreview);
  })();

  // gear: hold to open (keeps little fingers out of settings)
  (() => { const g = $('gear'); let tm = null;
    const start = (e) => { e.preventDefault(); g.classList.add('holding'); tm = setTimeout(() => { tm = null; g.classList.remove('holding'); $('settings').classList.add('open'); SFX.open(); }, 1100); };
    const stop = () => { if (tm) { clearTimeout(tm); tm = null; toast(t('settings.hold')); } g.classList.remove('holding'); };
    g.addEventListener('pointerdown', start); g.addEventListener('pointerup', stop); g.addEventListener('pointercancel', stop); g.addEventListener('pointerleave', stop);
    g.addEventListener('click', (e) => e.preventDefault());
  })();

  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  // ---------- boot ----------
  $('clock').innerHTML = clockSVG('c');
  renderStart();
  // expose for tests
  window.TS = { get state() { return S; }, settings, start: startGame, act: doAction, travel: (d, m) => { travelDest = d; return doTravel(m); }, goTo: openTravelTo, buy: doBuy, wish: doWish, sleep: goToSleep, wake, showSummary, engine: E, isBusy: () => busy };
})();

</script>
