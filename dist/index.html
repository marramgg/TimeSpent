<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSpent</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TimeSpent"><meta name="theme-color" content="#EFE2C6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F6C445'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23FFF8EA' stroke='%2333241A' stroke-width='4'/%3E%3Cline x1='50' y1='50' x2='50' y2='28' stroke='%2333241A' stroke-width='6' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23E4526E' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* ===== TimeSpent — styles ===== */
:root {
  --paper: #FFF8EA; --paper-2: #FBEFD6; --table: #EFE2C6;
  --wood: #F3D6A3; --wood-dark: #C98D4E; --wood-edge: #8E5B2C;
  --ink: #33241A; --ink-soft: #7B6552; --ink-line: #33241A;
  --berry: #E4526E; --berry-dark: #B23550;
  --leaf: #67B95A; --leaf-dark: #3F8F36;
  --gold: #F6C445; --gold-dark: #C88A12; --gold-light: #FFE38A;
  --sky-blue: #5FBBEF; --pink: #F58FB6; --lilac: #C79BE8; --grey: #D8CBB6;
  --night: #17213F; --night-2: #2B3A6B;
  --radius: 22px; --line: 3px;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --fs: clamp(16px, 2.1vmin + 8px, 22px);
  --vhu: 1vh;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
@supports (height: 1dvh) { :root { --vhu: 1dvh; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--table); overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font-body); font-size: var(--fs); color: var(--ink); line-height: 1.25;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sky-blue); outline-offset: 2px; }
svg { display: block; }
.hidden { display: none !important; }

/* ---------- app frame ---------- */
.app { position: fixed; inset: 0; height: 100dvh; width: 100%; background: var(--table); overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; }
.app[data-screen="start"] #start, .app[data-screen="game"] #game { display: flex; }

/* ---------- buttons (chunky, pressable) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 60px; padding: .55em 1.1em;
  border-radius: var(--radius); background: var(--gold); color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 1.15em;
  border: var(--line) solid var(--ink-line); box-shadow: 0 6px 0 var(--ink-line); transform: translateY(0); transition: transform .08s, box-shadow .08s; }
.btn:active, .btn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink-line); }
.btn.secondary { background: var(--paper); }
.btn.leaf { background: var(--leaf); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.berry { background: var(--berry); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.sky { background: var(--sky-blue); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.big { min-height: 76px; font-size: 1.5em; padding: .5em 1.4em; }
.btn[aria-disabled="true"] { background: var(--grey); color: var(--ink-soft); box-shadow: 0 6px 0 #9d8f7c; border-color: #9d8f7c; }

/* ---------- start screen ---------- */
.start { flex-direction: column; align-items: center; justify-content: flex-start; gap: 1em; padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background: linear-gradient(180deg, #8FD0F5 0%, #D8F1FF 55%, #BFE39C 55.2%, #A6D682 100%); text-align: center; overflow-y: auto; }
.start > * { flex-shrink: 0; }
/* clock and intro both take margin-top:auto, so spare space splits evenly: content stays centred, the intro sits at the bottom;
   on a screen too short for everything the page scrolls instead of clipping */
.start .clock-hero, .start .intro { margin-top: auto; }
.start .logo { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vmin, 92px); line-height: 1; color: var(--ink); letter-spacing: -.01em;
  text-shadow: 0 4px 0 #fff, 0 8px 0 rgba(0,0,0,.12); margin: .15em 0; }
.start .intro { font-size: .8em; font-weight: 700; line-height: 1.3; color: var(--ink-soft); max-width: 36em; margin-bottom: 0; text-wrap: balance; }
.start .logo b { color: var(--berry); }
.start .tagline { font-weight: 700; font-size: 1.05em; color: var(--ink-soft); max-width: 22em; text-wrap: balance; margin: 0; }
.start .pick { font-family: var(--font-display); font-size: 1.3em; margin: .4em 0 0; }
.modepick { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.mode-btn { display: grid; gap: 1px; justify-items: center; align-content: start; width: clamp(128px, 38vw, 168px); padding: 10px 8px;
  border-radius: 18px; background: var(--paper); border: var(--line) solid var(--ink-line); box-shadow: 0 5px 0 var(--ink-line); transition: transform .1s; }
.mode-btn .me { font-size: clamp(28px, 7vmin, 40px); line-height: 1.1; }
.mode-btn .ml { font-family: var(--font-display); font-weight: 700; font-size: 1.05em; }
.mode-btn .ms { font-size: .72em; font-weight: 700; color: var(--ink-soft); line-height: 1.2; text-wrap: balance; }
.mode-btn[aria-pressed="true"] { background: var(--gold-light); transform: scale(1.04); box-shadow: 0 5px 0 var(--ink-line), 0 0 0 5px rgba(246,196,69,.55); }
.big-row.wakeq { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.avatars { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.avatar-btn { width: clamp(64px, 14vmin, 96px); height: clamp(64px, 14vmin, 96px); border-radius: 50%; background: var(--paper); border: var(--line) solid var(--ink-line);
  box-shadow: 0 5px 0 var(--ink-line); font-size: clamp(34px, 7.5vmin, 54px); display: grid; place-items: center; transition: transform .1s; }
.avatar-btn[aria-pressed="true"] { background: var(--gold-light); transform: scale(1.12); box-shadow: 0 5px 0 var(--ink-line), 0 0 0 6px rgba(246,196,69,.55); }
@media (max-width: 430px) { /* phones: all six friends on one row, so the start screen fits without scrolling */
  .avatars { gap: 8px; } .avatar-btn { width: 52px; height: 52px; font-size: 28px; }
  .mode-btn { width: calc(50% - 8px); padding: 8px 6px; } .mode-btn .me { font-size: 26px; } }
.start .start-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.start .confirm { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.start .confirm p { margin: 0; font-weight: 800; }
@media (min-width: 700px) { /* tablets: buttons side by side, so the start screen also fits in landscape */
  .start .start-actions, .start .confirm { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .start .confirm p { flex-basis: 100%; } }
.lang-row { position: absolute; top: calc(var(--sat) + 12px); right: 14px; display: flex; gap: 6px; }
.seg { display: inline-flex; border: var(--line) solid var(--ink-line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.seg button { padding: .35em .9em; font-family: var(--font-display); font-weight: 600; min-height: 44px; min-width: 56px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.start .clock-hero { width: min(clamp(120px, 26vmin, 200px), 16vh); filter: drop-shadow(0 6px 0 rgba(0,0,0,.15)); }

/* ---------- game layout ---------- */
.game { flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(var(--sat) + 4px) calc(var(--sar) + 14px) 2px calc(var(--sal) + 14px); }
.topbar .gear { margin-left: auto; flex: 0 0 auto; }
@media (max-width: 480px) {
  .meters { grid-template-columns: .8fr 1.25fr 1.05fr auto; gap: 5px; }
  .meters.nofridge { grid-template-columns: 1fr 1.2fr auto; }
  .meter.wallet .lab .count { font-size: 1.15em; }
  .meter .lab span[data-i18n] { display: none; } .meter .lab { font-size: 1.05em; }
  .meter, .wallet { padding: 4px 6px; }
  .meter .segs { gap: 2px; } .meter .segs i { height: 11px; }
  .meter.fridge .stack { grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 8px; max-width: 62px; } .meter.fridge .stack .apple { width: 9px; height: 9px; }
  .wallet .coinstack { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; max-width: 74px; } .wallet .count { font-size: 1.3em; min-width: 1.1em; }
  .coin { width: 12px; height: 12px; }
  .daylabel .wk { font-size: .65em; padding: .15em .5em; }
  .daylabel .wd { font-size: .95em; }
}
.daylabel { display: flex; align-items: baseline; gap: .5em; font-family: var(--font-display); white-space: nowrap; min-width: 0; }
.daylabel .n { font-weight: 700; font-size: 1.1em; }
.daylabel .wd { font-weight: 600; color: var(--ink-soft); }
.daylabel .wk { font-size: .75em; font-weight: 700; background: var(--pink); color: #fff; padding: .15em .6em; border-radius: 999px; border: 2px solid var(--ink-line); }
.gear { width: 40px; height: 40px; border-radius: 50%; font-size: 19px; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--ink-line); opacity: .8; position: relative; }
.gear .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid var(--sky-blue); clip-path: inset(0 100% 0 0); opacity: 0; }
.gear.holding .ring { opacity: 1; animation: holdfill 1.1s linear forwards; }
@keyframes holdfill { to { clip-path: inset(0 0 0 0); } }

.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 0 calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px); }

/* hero: sky + clock + beads */
.hero { position: relative; border-radius: var(--radius); border: var(--line) solid var(--ink-line); overflow: hidden; background: var(--paper); flex: 0 0 auto; }
.sky { position: relative; height: clamp(44px, calc(var(--vhu) * 10.5), 200px); overflow: hidden; }
.sky .layer { position: absolute; inset: 0; transition: opacity 1s ease; }
.sky .day { background: linear-gradient(180deg, #55B7F0 0%, #A9E0FF 70%, #DDF4FF 100%); }
.sky .dusk { background: linear-gradient(180deg, #7A6BC8 0%, #F29A7A 55%, #FFD48A 100%); opacity: 0; }
.sky .nightl { background: linear-gradient(180deg, #0F1834 0%, #22305E 70%, #3B4E85 100%); opacity: 0; }
.sky .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1s;
  background-image: radial-gradient(2px 2px at 12% 30%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 28% 12%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 44% 26%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 62% 10%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 75% 32%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 88% 18%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 55% 40%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 20% 48%, #fff 60%, transparent 62%); }
.sky .hills { position: absolute; left: -5%; right: -5%; bottom: -2px; height: 34%; }
.sky .hills path { transition: fill 1s; }
.sky .sun, .sky .moon { position: absolute; width: 14%; max-width: 64px; aspect-ratio: 1; border-radius: 50%; left: 0; top: 0;
  transform: translate(-50%, -50%); transition: left 1s ease-in-out, top 1s ease-in-out, opacity .8s; }
.sky .sun { background: radial-gradient(circle at 40% 35%, #FFF3A6, #FFD23F 60%, #F5A623); box-shadow: 0 0 0 6px rgba(255,220,90,.35), 0 0 30px 10px rgba(255,210,70,.45); }
.sky .sun::after { content: ''; position: absolute; inset: -32%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,235,120,.55) 0 6deg, transparent 6deg 30deg); animation: spin 40s linear infinite; }
.sky .moon { background: radial-gradient(circle at 35% 35%, #FFFCE6, #E8E2B8 70%, #C9C08E); box-shadow: 0 0 24px 6px rgba(255,250,200,.35); opacity: 0; }
.sky .moon::before, .sky .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(160,150,110,.35); }
.sky .moon::before { width: 22%; height: 22%; left: 28%; top: 30%; } .sky .moon::after { width: 14%; height: 14%; left: 58%; top: 55%; }
@keyframes spin { to { transform: rotate(360deg); } }
.sky .cloud { position: absolute; width: 22%; height: 22%; top: 18%; left: 60%; opacity: .95; transition: opacity 1s; animation: drift 38s linear infinite; }
.sky .cloud.c2 { left: 10%; top: 40%; width: 16%; height: 16%; animation-duration: 52s; animation-delay: -20s; }
.sky .cloud i { position: absolute; background: #fff; border-radius: 50%; }
.sky .cloud i:nth-child(1) { width: 60%; height: 60%; left: 20%; top: 20%; }
.sky .cloud i:nth-child(2) { width: 45%; height: 45%; left: 0; top: 40%; }
.sky .cloud i:nth-child(3) { width: 50%; height: 50%; left: 48%; top: 38%; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-140%); } }

.clockrow { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vw, 28px); padding: 4px 12px 2px; margin-top: calc(-1 * clamp(34px, calc(var(--vhu) * 9), 92px)); position: relative; z-index: 2; }
.clock { width: clamp(74px, calc(var(--vhu) * 13.5), 180px); aspect-ratio: 1; filter: drop-shadow(0 6px 0 rgba(51,36,26,.9)); }
.clock .hand { transform-origin: 100px 100px; transition: transform .6s cubic-bezier(.5,0,.3,1); }
.clock.spin .hand { transition: transform 4.5s cubic-bezier(.4,0,.2,1); }
.digital { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-family: var(--font-display); background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 18px; padding: .3em .7em .4em; box-shadow: 0 5px 0 var(--ink-line); min-width: 5.2em; }
.digital .t { font-size: clamp(24px, calc(var(--vhu) * 4.6), 42px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.digital .p { font-size: .9em; font-weight: 600; color: var(--ink-soft); text-transform: lowercase; }
.digital .ico { font-size: 1em; }

.daybar { position: relative; padding: 6px 12px 4px; }
.daybar .cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.daybar .cells .c { height: clamp(8px, calc(var(--vhu) * 1.5), 14px); border-radius: 3px; background: #E9DFC7; border: 1.5px solid rgba(51,36,26,.14); display: flex; overflow: hidden; }
.daybar .cells .c b { flex: 1; display: block; height: 100%; }
.daybar .cells .c.pv { border-color: rgba(51,36,26,.5); }
.daybar .cells .c.night { background: var(--night-2); border-color: rgba(51,36,26,.35); background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.12) 4px 6px); }
.daybar .cells .c:nth-child(14) { margin-right: 1px; }
.daybar .plan { position: relative; height: clamp(13px, calc(var(--vhu) * 2.2), 19px); margin: 3px 0 0; }
/* the whole bar is the tap target — it reads out whatever is happening now, and costs no extra height */
.daybar[role="button"] { cursor: pointer; }
.daybar .plan .band { position: absolute; top: 0; height: 100%; box-sizing: border-box; border: 1.5px solid rgba(51,36,26,.35); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; }
.daybar .plan .band em { font-style: normal; font-size: clamp(9px, calc(var(--vhu) * 1.5), 13px); line-height: 1; }
.daybar .labels { position: relative; height: 13px; margin-top: 1px; font-size: 10px; line-height: 1; }
.daybar .labels span { position: absolute; top: 0; transform: translateX(-40%); }
.daybar .track { position: absolute; left: 12px; right: 12px; top: 12px; bottom: 16px; pointer-events: none; }
.daybar .now { position: absolute; top: -6px; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; }
.daybar .now::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top: 7px solid var(--ink); border-bottom: 0; }
.daybar .now::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--berry); border: 2px solid var(--ink); }
.daybar .ghost { position: absolute; top: -6px; bottom: 0; width: 0; border-left: 2px dashed var(--ink); margin-left: -1px; pointer-events: none; }
.daybar .ghost b { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 700; font-size: 11px; line-height: 1; padding: 2px 5px; border-radius: 6px; background: var(--ink); color: #fff; white-space: nowrap; z-index: 2; }
.daybar .ghost::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
.daybar.sum { padding: 8px 0 0; }
.daybar.sum .cells .c { height: 16px; } .daybar.sum .plan { height: 20px; } .daybar.sum .plan .band em { font-size: 13px; }

/* status: buddy + meters */
.status { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: stretch; flex: 0 0 auto; }
.buddy { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
.avatar { width: clamp(46px, calc(var(--vhu) * 8), 78px); height: clamp(46px, calc(var(--vhu) * 8), 78px); border-radius: 50%; background: var(--paper); border: var(--line) solid var(--ink-line); display: grid; place-items: center; font-size: clamp(26px, calc(var(--vhu) * 4.5), 44px); flex: 0 0 auto; box-shadow: 0 4px 0 var(--ink-line); }
.avatar.bounce { animation: bounce .5s; }
@keyframes bounce { 30% { transform: translateY(-8px) scale(1.05); } 60% { transform: translateY(2px); } }
.bubble { position: relative; flex: 1; min-height: clamp(40px, calc(var(--vhu) * 6.5), 60px); background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 18px; padding: .35em 3.5em .35em .7em; cursor: pointer; font-weight: 700; font-size: .92em; display: flex; align-items: center; box-shadow: 0 4px 0 var(--ink-line); }
.bubble::before { content: ''; position: absolute; left: -13px; top: 50%; width: 18px; height: 18px; background: var(--paper); border-left: var(--line) solid var(--ink-line); border-bottom: var(--line) solid var(--ink-line); transform: translateY(-50%) rotate(45deg); }
.bubble p { margin: 0; text-wrap: pretty; }
.bubble .speak { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; font-size: 19px; display: grid; place-items: center; background: var(--paper-2); border: 2px solid var(--ink-line); }
.bubble .speak.on { background: var(--gold-light); }
/* more to say: the bubble shows one message at a time and this chevron means "tap for the next one" */
.bubble .more { position: absolute; right: 52px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--berry); animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .bubble .more { animation: none; } }

.meters { display: grid; grid-template-columns: 1fr 1.1fr 1fr 1fr; gap: 8px; grid-column: 1 / -1; }
/* a child has no fridge to keep an eye on — grown-ups do the shopping — so the row is three meters wide */
.meters.nofridge { grid-template-columns: 1fr 1.1fr 1fr; }
.meters.nofridge .meter.fridge { display: none; }
/* a child's day has no coins in it either: two meters, side by side and twice as legible */
.meters.nocoins { grid-template-columns: 1fr 1fr; }
.meters.nocoins .meter.fridge, .meters.nocoins .meter.wallet { display: none; }

/* ---------- the day's question: two answers, as big as the grid they replace ---------- */
.question { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 2px; }
.question.hidden { display: none; }
.qtier { align-self: center; font-weight: 800; font-size: .82em; padding: .2em .9em; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink-line); color: var(--ink-soft); }
.question.must .qtier { background: var(--gold-light); color: var(--ink); }
.qtext { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15em; line-height: 1.15; text-wrap: balance; }
.qbtns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
.qbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 80px;
  border-radius: 20px; border: var(--line) solid var(--ink-line); box-shadow: 0 6px 0 var(--ink-line); background: var(--paper);
  transition: transform .1s; cursor: pointer; }
.qbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink-line); }
.qbtn .qi { font-size: clamp(34px, 11vh, 60px); line-height: 1.05; }
.qbtn .ql { font-family: var(--font-display); font-weight: 700; font-size: 1.15em; }
.qbtn .qc { display: flex; align-items: center; gap: 4px; min-height: 18px; }
.qbtn.yes { background: #DFF3D2; }
.qbtn.no { background: #FBE0E4; }
/* "Oops, go back" floats over the bottom of the screen. The cards scroll under it, but the two answers do not — they
   fill the space — so give them room while it is there. */
.undobar.show ~ .question { padding-bottom: 56px; }
.meter.fridge .apples { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.meter.fridge .stack { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; justify-items: center; max-width: 76px; font-size: 10px; line-height: 1; max-height: 24px; overflow: hidden; }
.meter.fridge .stack .apple { display: block; width: 11px; height: 11px; }
.meter.fridge .stack .empty { color: var(--ink-soft); font-weight: 800; }
.meter.fridge .lab .count { font-family: var(--font-display); font-weight: 700; font-size: 1.15em; font-variant-numeric: tabular-nums; margin-left: auto; }
.meter.fridge .lunch { font-size: 1.05em; }
.meter.fridge.low .lab { animation: wiggle 1.2s ease-in-out infinite; }
.meter { background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow: hidden; }
.meter .lab { display: flex; align-items: center; gap: .3em; font-family: var(--font-display); font-weight: 600; font-size: .8em; white-space: nowrap; min-width: 0; overflow: hidden; }
.meter .lab span[data-i18n] { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.meter .lab .coin, .meter .lab .count, .meter .lab .pvd, .meter .lab .lunch { flex: 0 0 auto; }
.meter .segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.meter .segs i { height: clamp(9px, calc(var(--vhu) * 1.7), 14px); border-radius: 5px; background: #EDE3CF; border: 2px solid rgba(51,36,26,.2); transition: background .3s; }
.meter.tummy .segs i.on { background: var(--leaf); border-color: var(--leaf-dark); }
.meter.tummy.low .segs i.on { background: var(--berry); border-color: var(--berry-dark); }
.meter.happy .segs i.on { background: var(--pink); border-color: #C55A85; }
.meter.happy.low .segs i.on { background: var(--berry); border-color: var(--berry-dark); }
@keyframes pvpulse { 50% { opacity: .35; } }
.meter .segs i.lose { background: repeating-linear-gradient(135deg, var(--berry) 0 3px, #fff 3px 6px) !important; border-color: var(--berry-dark) !important; animation: pvpulse 1s ease-in-out infinite; }
.meter.tummy .segs i.gain { background: repeating-linear-gradient(135deg, var(--leaf) 0 3px, #fff 3px 6px); border-color: var(--leaf-dark); }
.meter.happy .segs i.gain { background: repeating-linear-gradient(135deg, var(--pink) 0 3px, #fff 3px 6px); border-color: #C55A85; }
.meter.fridge .apple.lose { opacity: .4; filter: saturate(.4); animation: pvpulse 1s ease-in-out infinite; }
.meter.fridge .apple.gain { opacity: .5; filter: grayscale(.7); }
.coin.lose { opacity: .35; animation: pvpulse 1s ease-in-out infinite; }
.coin.gain { background: #fff; border-style: dashed; box-shadow: none; opacity: .85; }
.meter .lab .pvd { font-family: var(--font-display); font-weight: 800; font-size: .9em; color: var(--leaf-dark); margin-left: 2px; }
.meter .lab .pvd.down { color: var(--berry-dark); }
.meter.low .lab { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.wallet { background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.wallet .coinstack { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; justify-items: center; max-width: 90px; }
.wallet .count { font-family: var(--font-display); font-weight: 700; font-size: 1.5em; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
.meter.wallet { flex-direction: column; align-items: stretch; gap: 4px; }
.meter.wallet .lab .count { margin-left: auto; font-size: 1.15em; min-width: 0; }
.meter.wallet .lab > .coin { width: 15px; height: 15px; }
.meter.wallet .coinstack { min-height: 14px; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-dark)); border: 2px solid var(--gold-dark); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.coin.lg { width: 22px; height: 22px; }
.wallet.pop .count { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.35); } }
.wishbox { grid-column: 1 / -1; background: var(--paper); border: var(--line) dashed var(--ink-line); border-radius: 16px; padding: 4px 10px; display: flex; align-items: center; gap: 10px; }
.wishbox .wemoji { font-size: 1.6em; }
.wishbox .wtxt { font-family: var(--font-display); font-weight: 600; flex: 1; min-width: 0; }
.wishbox .bar { height: 12px; border-radius: 999px; background: #EDE3CF; border: 2px solid rgba(51,36,26,.25); overflow: hidden; margin-top: 3px; }
.wishbox .bar i { display: block; height: 100%; background: var(--gold); transition: width .5s; }
.wishbox .wnum { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.wishbox.ready { background: var(--gold-light); border-style: solid; }

/* place + actions */
.place { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: var(--radius) var(--radius) 0 0; border-bottom: 0; overflow: hidden; }
.places { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; padding: 5px 8px; background: var(--wood); border-bottom: var(--line) solid var(--ink-line); }
.ptile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: clamp(44px, calc(var(--vhu) * 7.5), 60px); padding: 2px 2px; border-radius: 14px; background: var(--paper); border: var(--line) solid rgba(51,36,26,.35); cursor: pointer; text-align: center; transition: transform .08s; }
.ptile:active { transform: translateY(2px); }
.ptile .pe { font-size: clamp(20px, calc(var(--vhu) * 3.6), 30px); line-height: 1; }
.ptile .pl { font-family: var(--font-display); font-weight: 700; font-size: .8em; line-height: 1.05; }
.ptile .psub { font-size: .62em; font-weight: 700; color: var(--ink-soft); line-height: 1; }
.ptile .pst { font-size: .6em; font-weight: 800; line-height: 1; padding: 1px 5px; border-radius: 999px; margin-top: 1px; }
.ptile .pst.open { background: var(--leaf); color: #fff; } .ptile .pst.closed { background: #EDE6DA; color: var(--berry-dark); }
.ptile.here { background: var(--gold-light); border-color: var(--ink-line); box-shadow: 0 3px 0 var(--ink-line); }
.ptile.here::before { content: '📍'; position: absolute; top: -8px; right: -4px; font-size: 14px; }
.ptile.closed:not(.here) { opacity: .7; }
.ptile.closed:not(.here) .pe { filter: grayscale(.7); }
.psub { font-family: var(--font-display); font-weight: 600; font-size: .7em; color: var(--ink-soft); }
.actions { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: max-content; gap: 8px; padding: 8px 10px calc(var(--sab) + 10px); align-content: start; }
/* when the cards do not all fit, say so: a child will not scroll a box that looks finished */
.place.more::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34px; pointer-events: none; z-index: 3;
  background: linear-gradient(180deg, rgba(255,248,234,0) 0%, var(--paper) 92%); }
.place.more .actions { scroll-padding-bottom: 34px; }
.action { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; min-height: clamp(46px, calc(var(--vhu) * 7.5), 76px); padding: 5px 9px; border-radius: 18px; cursor: pointer;
  background: var(--paper-2); border: var(--line) solid var(--ink-line); box-shadow: 0 5px 0 var(--ink-line); transition: transform .08s, box-shadow .08s; position: relative; }
.action .txt { display: block; flex: 1 1 auto; min-width: 0; }
.action:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink-line); }
.action .ae { flex: 0 0 auto; font-size: clamp(26px, calc(var(--vhu) * 4.8), 40px); line-height: 1; width: 1.2em; text-align: center; }
.action .al { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.05em; line-height: 1.15; }
.action .ac { display: block; margin-top: 3px; line-height: 1.75; }
.action .ac > * { vertical-align: middle; margin-right: 6px; }
.action.go { background: var(--sky-blue); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
.action.bed { background: var(--night-2); color: #fff; }
.action.disabled { background: #EDE6DA; color: var(--ink-soft); box-shadow: 0 5px 0 #A99C88; border-color: #A99C88; }
.action.disabled .ae { filter: grayscale(1); opacity: .6; }
.action .why { display: block; font-size: .78em; font-weight: 700; color: var(--berry-dark); margin-top: 1px; line-height: 1.1; }
.action.disabled .why { color: var(--ink-soft); }
.action.wide { grid-column: 1 / -1; }
/* the bed card when there is nothing left to eat: sleeping is the way out, so it says so */
.action.urge { animation: urge 1.4s ease-in-out infinite; }
@keyframes urge { 0%, 100% { box-shadow: 0 5px 0 var(--ink-line), 0 0 0 0 rgba(246,196,69,0); } 50% { box-shadow: 0 5px 0 var(--ink-line), 0 0 0 7px rgba(246,196,69,.55); } }
@media (prefers-reduced-motion: reduce) { .action.urge { animation: none; box-shadow: 0 5px 0 var(--ink-line), 0 0 0 5px rgba(246,196,69,.6); } }

/* "Oops, go back": a mis-tap costs an hour of the day, so time-only actions can be taken back */
.undobar { display: none; position: absolute; left: 10px; right: 10px; bottom: calc(var(--sab) + 8px); z-index: 4; }
.undobar.show { display: block; animation: slideup .2s ease-out; }
.undobar .btn { width: 100%; min-height: 46px; font-size: 1em; background: var(--paper-2); box-shadow: 0 6px 0 var(--ink-line), 0 8px 18px rgba(51,36,26,.28); }

/* chips: time discs + coins */
.tchips { display: inline-flex; align-items: center; gap: 3px; vertical-align: middle; }
.tchips svg { width: 18px; height: 18px; }
.cchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: .95em; padding: 1px 8px 1px 4px; border-radius: 999px; border: 2px solid var(--ink-line); background: #fff; color: var(--ink); }
.cchip.earn { background: var(--leaf); color: #fff; border-color: var(--leaf-dark); }
.cchip.spend { background: var(--berry); color: #fff; border-color: var(--berry-dark); }
.cchip .coin { width: 12px; height: 12px; border-width: 1.5px; }
.cchip.free { background: #fff; color: var(--leaf-dark); }
.mchip { display: inline-flex; align-items: center; gap: 3px; font-size: .9em; font-weight: 800; white-space: nowrap; vertical-align: middle; }
.mchip .coin { width: 12px; height: 12px; border-width: 1.5px; flex: 0 0 auto; }

/* ---------- sheets & overlays ---------- */
.sheet, .overlay { position: absolute; inset: 0; z-index: 20; display: none; }
.sheet.open, .overlay.open { display: block; }
.sheet .scrim, .overlay .scrim { position: absolute; inset: 0; background: rgba(51,36,26,.45); }
.sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--paper); border: var(--line) solid var(--ink-line); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 12px 14px calc(var(--sab) + 16px); display: flex; flex-direction: column; gap: 10px; animation: slideup .25s ease-out; overflow-y: auto; }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
.sheet h2, .overlay h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5em; margin: 0; text-wrap: balance; }
.sheet .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.close { width: 48px; height: 48px; border-radius: 50%; border: var(--line) solid var(--ink-line); background: var(--paper-2); font-size: 22px; display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink-line); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: max-content; gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; min-height: 104px; border-radius: 18px; background: var(--paper-2); border: var(--line) solid var(--ink-line); box-shadow: 0 5px 0 var(--ink-line); text-align: center; position: relative; }
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink-line); }
.tile .te { font-size: clamp(34px, 7vmin, 48px); line-height: 1; }
.tile .tl { font-family: var(--font-display); font-weight: 600; font-size: 1.05em; }
.tile .ts { font-size: .78em; font-weight: 700; color: var(--ink-soft); }
.tile .ts.open { color: var(--leaf-dark); }
.tile .ts.closed { color: var(--berry-dark); }
.tile.here { background: var(--gold-light); }
.tile.here::after { content: '📍'; position: absolute; top: 6px; right: 8px; }
.tile.disabled { background: #EDE6DA; color: var(--ink-soft); box-shadow: 0 5px 0 #A99C88; border-color: #A99C88; }
.tile.disabled .te { filter: grayscale(1); opacity: .6; }
.tile .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; }
.tile .tbtn { margin-top: auto; min-height: 44px; padding: .25em .8em; border-radius: 999px; border: 2px solid var(--ink-line); background: var(--gold); font-family: var(--font-display); font-weight: 600; box-shadow: 0 3px 0 var(--ink-line); }
.tile .tbtn.wish { background: var(--paper); }
.tile .tbtn.wish.on { background: var(--pink); color: #fff; }
.tile .tbtn.got { background: var(--leaf); color: #fff; }
.tile .tbtn.need { background: #EDE6DA; color: var(--ink-soft); box-shadow: 0 3px 0 #A99C88; border-color: #A99C88; }
.tile .badge { position: absolute; top: -8px; left: -8px; background: var(--pink); color: #fff; border: 2px solid var(--ink-line); border-radius: 999px; font-size: .8em; padding: .05em .5em; font-weight: 800; }
.tabs { display: flex; gap: 8px; }
.tabs button { flex: 1; min-height: 50px; border-radius: 999px; border: var(--line) solid var(--ink-line); background: var(--paper-2); font-family: var(--font-display); font-weight: 600; font-size: 1.05em; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
.modes { display: grid; grid-template-columns: 1fr; grid-auto-rows: max-content; gap: 10px; }
.modes .action { min-height: 70px; }
.travel-dest { display: flex; align-items: center; gap: .5em; font-family: var(--font-display); font-weight: 700; font-size: 1.3em; }

.overlay .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 560px); max-height: 92%; overflow-y: auto; background: var(--paper); border: var(--line) solid var(--ink-line); border-radius: 26px;
  padding: 18px 18px calc(var(--sab) + 18px); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 0 var(--ink-line); animation: popin .3s ease-out; }
@keyframes popin { from { transform: translate(-50%, -46%) scale(.96); opacity: 0; } }
.overlay .card .big-row { display: flex; justify-content: center; }
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sumcell { background: var(--paper-2); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 8px; text-align: center; }
.sumcell .k { font-size: .8em; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.sumcell .v { font-family: var(--font-display); font-weight: 700; font-size: 1.7em; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sumcell.earn .v { color: var(--leaf-dark); } .sumcell.spend .v { color: var(--berry-dark); }
.walletline { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.2em; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.legend div { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.legend .sw { width: 16px; height: 16px; border-radius: 5px; border: 2px solid rgba(51,36,26,.5); flex: 0 0 auto; }
.legend .wide { grid-column: 1 / -1; }
.legend .tchips svg { width: 16px; height: 16px; }
.forecast { display: flex; align-items: center; justify-content: center; gap: .5em; font-family: var(--font-display); font-weight: 600; font-size: 1.15em; background: var(--paper-2); border: var(--line) solid var(--ink-line); border-radius: 16px; padding: 8px; }
.forecast .fe { font-size: 1.6em; }
/* sleep line in the summary: how long the night is, and whether tomorrow is a sleepy day */
.sumsleep { font-size: 1em; text-align: left; justify-content: flex-start; }
.sumsleep .ft { line-height: 1.25; } .sumsleep .ft b { font-family: var(--font-display); font-weight: 700; }
.sumsleep.bad { background: #EFE3FF; border-color: #6B4FB3; color: #3C2A78; }
.avatar { position: relative; }
/* the hours after the usual 21:00 bedtime, still playable until midnight */
.daybar .cells .c.late { background: #D9D1E8; border-color: rgba(51,36,26,.3); }

.night-screen { background: var(--night); }
.night-screen .scrim { background: transparent; }
.night-screen .starsbig { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 10% 20%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 30% 10%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 50% 30%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 70% 15%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 85% 35%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 20% 55%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 60% 60%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 90% 70%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 40% 80%, #fff 60%, transparent 62%); animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .6; } to { opacity: 1; } }
.night-screen .card { background: transparent; border: 0; box-shadow: none; color: #fff; align-items: center; text-align: center; }
.night-screen .nmoon { width: clamp(64px, 14vmin, 110px); aspect-ratio: 1; border-radius: 50%; margin-bottom: 24px; background: radial-gradient(circle at 35% 35%, #FFFCE6, #E8E2B8 70%, #C9C08E); box-shadow: 0 0 40px 12px rgba(255,250,200,.35); animation: moonrise 4.5s ease-in-out forwards; }
@keyframes moonrise { from { transform: translateX(-70px) translateY(10px); } to { transform: translateX(70px) translateY(-10px); } }
.night-screen .zzz { font-family: var(--font-display); font-size: clamp(34px, 8vmin, 60px); font-weight: 700; }
.night-screen .zzz span { display: inline-block; animation: floatz 1.5s ease-in-out infinite; }
.night-screen .zzz span:nth-child(2) { animation-delay: .3s; } .night-screen .zzz span:nth-child(3) { animation-delay: .6s; }
@keyframes floatz { 50% { transform: translateY(-10px); } }
.night-screen .clock { width: clamp(130px, 30vmin, 200px); }
.night-screen .sleeper { font-size: clamp(56px, 14vmin, 96px); line-height: 1; }

.morning-screen .card { text-align: center; align-items: center; }
.morning-screen .sunbig { width: clamp(80px, 18vmin, 140px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFF3A6, #FFD23F 60%, #F5A623); box-shadow: 0 0 0 8px rgba(255,220,90,.35), 0 0 40px 14px rgba(255,210,70,.45); animation: sunrise .8s ease-out; }
@keyframes sunrise { from { transform: translateY(40px) scale(.6); opacity: 0; } }
.morning-screen .mday { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 6vmin, 40px); }

/* settings */
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings .row .k { font-family: var(--font-display); font-weight: 600; font-size: 1.1em; }
.settings .about { font-size: .95em; color: var(--ink-soft); margin: 0; font-weight: 600; }
.settings .danger { display: flex; flex-direction: column; gap: 8px; }

/* toast */
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translateX(-50%); z-index: 30; background: var(--ink); color: #fff; font-family: var(--font-display); font-weight: 600; padding: .5em 1em; border-radius: 999px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }

/* flying coins */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.fx .coin { position: absolute; width: 24px; height: 24px; will-change: transform; }

/* ---------- wide / landscape (iPad) ---------- */
@media (min-width: 860px) and (orientation: landscape) {
  .body { display: grid; grid-template-columns: minmax(360px, 46%) 1fr; grid-template-rows: auto 1fr; gap: 12px; padding-bottom: 12px; }
  .hero { grid-column: 1; grid-row: 1; }
  .status { grid-column: 1; grid-row: 2; align-content: start; }
  .place { grid-column: 2; grid-row: 1 / 3; border-radius: var(--radius); border-bottom: var(--line) solid var(--ink-line); }
  .actions { grid-template-columns: 1fr 1fr; padding-bottom: 12px; }
  .sky { height: clamp(160px, 30vh, 260px); }
  .clock { width: clamp(150px, 24vh, 200px); }
  .action { min-height: 70px; }
  .sheet .panel { left: 50%; right: auto; transform: translateX(-50%); width: min(92%, 640px); border-radius: 26px; bottom: 4%; border-bottom: var(--line) solid var(--ink-line); }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 700px) and (orientation: portrait) {
  .actions { grid-template-columns: 1fr 1fr 1fr; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
/* Phones. The scenery is lovely but it is not what a child touches, so on a short screen it gives way

<body>
<div id="app" class="app" data-screen="start">

  <!-- ===== Start screen ===== -->

      <div role="button" tabindex="0" class="mode-btn" data-mode="adult"><span class="me">🧑‍🍳</span><span class="ml" data-i18n="modeAdult"></span><span class="ms" data-i18n="modeAdultSub"></span></div>
    </div>
    <p class="pick" data-i18n="pickFriend"></p>
    <div class="avatars" id="avatars"></div>
    <div class="start-actions">
      <button class="btn big leaf" id="btnContinue"></button>
      <button class="btn big" id="btnPlay"></button>
      <button class="btn secondary" id="btnNew"></button>
      <div class="confirm hidden" id="newConfirm">
        <p data-i18n="settings.sure"></p>
        <button class="btn berry" id="btnNewYes" data-i18n="settings.yes"></button>
        <button class="btn secondary" id="btnNewNo" data-i18n="settings.no"></button>
      </div>
    </div>
    <p class="intro" data-i18n="intro"></p>
  </section>

  <!-- ===== Game screen ===== -->
  <main id="game" class="screen game">
    <header class="topbar">
      <div class="daylabel"><span class="n" id="dayN"></span><span class="wd" id="weekday"></span><span class="wk hidden" id="wkBadge"></span></div>
      <button class="gear" id="gear" aria-label="Grown-ups"><span class="ring"></span>⚙️</button>
    </header>

    <div class="body">
      <section class="hero">
        <div class="sky" id="sky">
          <div class="layer day"></div>
          <div class="layer dusk"></div>
          <div class="layer nightl"></div>
          <div class="stars"></div>
          <div class="cloud c1"><i></i><i></i><i></i></div>
          <div class="cloud c2"><i></i><i></i><i></i></div>
          <div class="moon" id="moon"></div>
          <div class="sun" id="sun"></div>
          <svg class="hills" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
            <path id="hillBack" d="M0,40 C60,10 120,10 180,32 C240,52 300,8 400,30 L400,60 L0,60 Z" fill="#8FCB6F"/>
            <path id="hillFront" d="M0,50 C80,30 150,60 220,44 C290,28 340,50 400,42 L400,60 L0,60 Z" fill="#6FB65A"/>
          </svg>
        </div>
        <div class="clockrow">
          <div class="clock" id="clock"></div>
          <div class="digital"><span class="t" id="digital">7:00</span><span class="p"><span class="ico" id="partIco">🌅</span> <span id="partTxt"></span></span></div>
        </div>
        <div class="daybar" id="daybar"></div>
      </section>

      <section class="status">
        <div class="buddy">
          <div class="avatar" id="avatar">🐻</div>

        </div>
        <div class="meters">
          <div class="meter tummy" id="mTummy"><div class="lab"><span id="tummyIco">🍎</span> <span id="tummyLab"></span><span class="pvd hidden"></span></div><div class="segs"></div></div>
          <div class="meter happy" id="mHappy"><div class="lab">😊 <span data-i18n="happy"></span><span class="pvd hidden"></span></div><div class="segs"></div></div>
          <div class="meter fridge" id="mFridge"><div class="lab">🧺 <span data-i18n="fridge"></span><span class="lunch hidden" id="lunchBadge">🍱</span><span class="pvd hidden"></span><span class="count" id="fridgeCount">0</span></div><div class="apples" id="apples"></div></div>
          <div class="meter wallet" id="wallet"><div class="lab"><span class="coin"></span> <span data-i18n="coins"></span><span class="pvd hidden"></span><span class="count" id="coinCount">0</span></div><div class="coinstack" id="coinstack"></div></div>
          <div class="wishbox hidden" id="wishbox"><span class="wemoji"></span><div class="wtxt"><div class="wname"></div><div class="bar"><i></i></div></div><span class="wnum"></span></div>

      </section>

      <section class="place">
        <div class="places" id="places"></div>
        <div class="undobar" id="undoBar"><button class="btn secondary" id="btnUndo"></button></div>

             "no" button shows what you get instead — a poo for unwashed hands. -->

          <span class="qtier" id="qTier"></span>
          <p class="qtext" id="qText"></p>

            <div role="button" tabindex="0" class="qbtn no" data-ans="no" data-min="0"><span class="qi"></span><span class="ql"></span><span class="qc"></span></div>

      </section>
    </div>
  </main>

  <div class="sheet" id="travelSheet">

      </div>

    </div>

    <div class="card">

      <div class="row"><span class="k" data-i18n="settings.lang"></span><div class="seg" id="setLang"><button data-v="en">EN</button><button data-v="pt">PT</button></div></div>

          <button class="btn secondary" id="btnResetNo" data-i18n="settings.no"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="fx" id="fx"></div>
</div>

function fmt(str, vars) {
  return String(str).replace(/\{(\w+)\}/g, (_, k) => (vars && k in vars) ? vars[k] : `{${k}}`);
}

    // On a school day lunch is at school; at a weekend it is asked at home, and it is the only weekend-only question.
    lunch:     { emoji: '🍲', minutes: 30, tummy: 1, happy: 1, cat: 'eat', msg: 'ateLunch', tier: 'should',
                 no: '😫', skipTummy: 2, skipMsg: 'skipLunch', weekendOnly: true,
                 due: (s) => s.time >= CHILD.lunchAt && s.time < CHILD.dinnerFrom },
    wash:      { emoji: '🧼', minutes: 15, tummy: 1, msg: 'washedHands', tier: 'should',
                 no: '💩', skipTummy: 1, skipMsg: 'skipWash', due: (s) => s.time >= CHILD.lunchAt && !choreDone(s, 'dinner') },
    tidy:      { emoji: '🧹', minutes: 15, happy: 1, msg: 'tidiedUp', tier: 'should',
                 no: '🌪️', skipHappy: 1, skipMsg: 'skipTidy', due: (s) => s.time >= CHILD.lunchAt && !choreDone(s, 'dinner') },
    dinner:    { emoji: '🍽️', minutes: 30, tummy: 1, happy: 1, cat: 'eat', msg: 'ateDinner', tier: 'should',
                 no: '😫', skipTummy: 2, skipMsg: 'skipDinner', due: (s) => s.time >= CHILD.dinnerFrom },
    bath:      { emoji: '🛁', minutes: 30, tummy: 1, happy: 2, cat: 'play', msg: 'hadBath', tier: 'should',
                 no: '🐴', skipTummy: 1, skipMsg: 'skipBath', bathDayOnly: true, due: (s) => settled(s, 'dinner') },
    teethPM:   { emoji: '🪥', minutes: 15, tummy: 1, msg: 'brushedTeeth', tier: 'should',
                 no: '🦠', skipTummy: 1, skipMsg: 'skipTeeth', due: (s) => settled(s, 'dinner') },
  };

  // One new thing per day, so day 1 is the smallest complete day: wake, eat, work, come home, eat, sleep.
  const PLACES = {
    home:   { emoji: '🏠', unlockDay: 1 },
    bakery: { emoji: '🥖', unlockDay: 1, open: 8 * 60, close: 18 * 60, weekdaysOnly: true, mode: 'adult' },
    school: { emoji: '🏫', unlockDay: 1, open: 8 * 60, close: 17 * 60 + 30, weekdaysOnly: true, mode: 'child' }, // doors open at 8:00; the bell is at 8:30
    shops:  { emoji: '🏬', unlockDay: 2, open: 9 * 60, close: 18 * 60, mode: 'adult' }, // shopping is the grown-up's day; a child's has no coins
    park:   { emoji: '🌳', unlockDay: 3, childUnlockDay: 2 },
  };
  const TRAVEL = {
    walk: { emoji: '🚶', min: 60, cost: 0, unlockDay: 1 },
    bus:  { emoji: '🚌', min: 30, cost: 1, unlockDay: 2 },
    bike: { emoji: '🚲', min: 30, cost: 0, unlockDay: 1, needs: 'bike' },
  };
  const ITEMS = {
    meals: { emoji: '🧺', price: 5, stall: 'food', meals: 6 },
    hat:   { emoji: '🎩', price: 2, stall: 'toys', wear: true, fun: true },
    ball:  { emoji: '⚽', price: 3, stall: 'toys' },
    teddy: { emoji: '🧸', price: 5, stall: 'toys' },
    kite:  { emoji: '🪁', price: 8, stall: 'toys' },
    bike:  { emoji: '🚲', price: 12, stall: 'toys' },
    train: { emoji: '🚂', price: 20, stall: 'toys' },
  };
  const STALL_UNLOCK = { food: 2, toys: 4 };
  const SHOW_UNLOCK = 4, LUNCHBOX_FROM = 2, FRIDGE_MAX = 20;
  const CAT_COLORS = { work: '#F6C445', travel: '#6EC1E4', eat: '#8BD17C', play: '#F58FB6', wait: '#D8CBB6', shop: '#C79BE8', sleep: '#3D4A7A' };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const weekday = (day) => (day - 1) % 7;          // 0 = Monday
  const isWeekend = (day) => weekday(day) >= 5;

  // Which game we are playing. Everything below that differs asks these, so adult mode is untouched by child mode.
  const isChild = (s) => s.mode === 'child';
  const stepOf = (s) => isChild(s) ? CHILD_STEP : STEP;
  const slotsOf = (s) => (LATEST_BED - DAY_START) / stepOf(s);
  const bedtimeOf = (s) => isChild(s) ? CHILD.goodBed : BEDTIME;   // when the game says "bed now"
  const latestOf = (s) => isChild(s) ? CHILD.latestBed : LATEST_BED; // when you fall asleep whatever you were doing
  const hungerOf = (s) => isChild(s) ? 0 : HUNGER_PER_STEP; // a child is fed by grown-ups: health moves at meals, not by the clock
  const bathDay = (s) => s.day % 2 === 0;  // a bath every second day
  const choreDone = (s, id) => !!(s.chores && s.chores[id]);
  const choreSkipped = (s, id) => !!(s.skipped && s.skipped[id]);
  const settled = (s, id) => choreDone(s, id) || choreSkipped(s, id); // asked and answered, whichever way
  // Bed by 20:30 means waking at 7:00 with a spare quarter of an hour to play; later means 7:30 and no play before school.
  const wakeAfter = (bedAt) => bedAt <= CHILD.goodBed ? CHILD.wakeEarly : CHILD.wakeLate;

  // The day's plan: where to be, hour by hour (hours may run past 24 for the night block).
  function routine(state) {
    const b = (id, from, to, cat, place, emoji) => ({ id, from, to, cat, place, emoji });
    if (isChild(state)) return childRoutine(state, b);
    const wk = isWeekend(state.day), park = state.day >= PLACES.park.unlockDay, shops = state.day >= PLACES.shops.unlockDay;
    const day = wk ? [
      b('breakfast', 7, 7.5, 'eat', 'home', '🍳'),
      b('free', 7.5, 9, 'play', 'home', '🧸'),
      park ? b('park', 9, 13, 'play', 'park', '🌳') : b('free', 9, 13, 'play', 'home', '🧸'),
      b('lunch', 13, 13.5, 'eat', null, '🍱'),
      shops ? b('shops', 13.5, 15, 'shop', 'shops', '🏬') : b('free', 13.5, 15, 'play', 'home', '🧸'),
      park ? b('park', 15, 17.5, 'play', 'park', '🌳') : b('goHome', 15, 17.5, 'travel', 'home', '🏠'),
      b('goHome', 17.5, 18.5, 'travel', 'home', '🚶'),
      b('dinner', 18.5, 19, 'eat', 'home', '🍳'),
      b('free', 19, 21, 'play', 'home', '🧸'),
    ] : [
      b('breakfast', 7, 7.5, 'eat', 'home', '🍳'),
      state.day >= LUNCHBOX_FROM ? b('pack', 7.5, 8, 'eat', 'home', '🍱') : b('free', 7.5, 8, 'play', 'home', '🧸'),
      b('goWork', 8, 9, 'travel', 'bakery', '🚶'),
      b('work', 9, 13, 'work', 'bakery', '🥖'),
      b('lunch', 13, 13.5, 'eat', null, '🍱'),
      b('work2', 13.5, 17.5, 'work', 'bakery', '🥖'),
      b('goHome', 17.5, 18.5, 'travel', 'home', '🚶'),
      b('dinner', 18.5, 19, 'eat', 'home', '🍳'),
      b('free', 19, 21, 'play', 'home', '🧸'),
    ];
    day.push(b('sleep', 21, 31, 'sleep', 'home', '😴'));
    return day;
  }
  // A child's plan. School is one card, but the strip still shows the shape of it — forest, lunch, activities — so the
  // child can see where the day goes and how little of it is theirs.
  function childRoutine(state, b) {
    const wk = isWeekend(state.day), wake = (state.wake || CHILD.wakeEarly) / 60, park = unlocked(state, 'park');
    const day = wk ? [
      b('getReady', wake, 9, 'eat', 'home', '🥣'),
      park ? b('park', 9, 12, 'play', 'park', '🌳') : b('freeHome', 9, 12, 'play', 'home', '🧸'),
      b('lunch', 12, 13, 'eat', 'home', '🍽️'),
      b('freeHome', 13, 18.5, 'play', 'home', '🧸'),
    ] : [
      b('getReady', wake, 8, 'eat', 'home', '🥣'),
      b('goSchool', 8, 8.5, 'travel', 'school', '🚶'),
      b('school', 8.5, 12, 'work', 'school', '🏫'),
      b('lunchSchool', 12, 13, 'eat', 'school', '🍽️'),
      b('activities', 13, 17.5, 'work', 'school', '🎨'),
      b('goHome', 17.5, 17.75, 'travel', 'home', '🚶'),
      b('tidyUp', 17.75, 18.5, 'wait', 'home', '🧼'),
    ];
    day.push(b('dinner', 18.5, 19.5, 'eat', 'home', '🍽️'));
    day.push(bathDay(state) ? b('bath', 19.5, 20.5, 'play', 'home', '🛁') : b('freeHome', 19.5, 20.5, 'play', 'home', '🧸'));
    day.push(b('sleep', 20.5, 31, 'sleep', 'home', '😴'));
    return day;
  }
  const bandAt = (state, time) => routine(state).find(x => time >= x.from * 60 && time < x.to * 60) || null;
  function planHint(state, out) {
    if (state.time >= bedtimeOf(state)) return;
    const band = bandAt(state, state.time); if (!band) return;
    if (state.lastBand === band.id) return;
    state.lastBand = band.id;
    out.msgs.push({ key: 'plan', band: band.id });
  }

  function newGame(avatar, seed, mode) {
    const child = mode === 'child';
    return {
      v: 7, mode: child ? 'child' : 'adult',
      avatar: avatar || '🐻', seed: seed || 12345, // kept for saves and tests; nothing is random any more
      day: 1, time: DAY_START, coins: 2, loc: 'home',
      wake: DAY_START, chores: {}, skipped: {}, // the child's wake-up time today, and how each question was answered
      // The fridge starts with four meals: breakfast and dinner on days 1 and 2, so it runs out exactly when the shops open.
      tummy: 3, happy: child ? 3 : WAKE_HAPPY, fridge: 4, lunchbox: 0,
      wardrobe: {}, toys: [], wish: null, wishReadyTold: false,
      timeline: [], today: freshToday(),
      flags: {}, phase: 'day', msgs: [], lastBand: child ? 'getReady' : 'breakfast',
      totals: { earned: 0, spent: 0 },
      slept: 10 * 60, bedAt: null, // minutes slept last night, when we went to bed today
    };
  }
  const freshToday = () => ({ earned: 0, spent: 0 });

  function timeInfo(t) {
    const h = Math.floor(t / 60) % 24, m = t % 60;
    const part = h >= 21 || h < 7 ? 'night' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    return { h, m, part, h12: h % 12 === 0 ? 12 : h % 12 };
  }

  // ---- sleep ----
  // What a night starting at bedAt does: minutes slept, and the happiness bonus for every full hour beyond what is needed.
  function nightMath(state, bedAt) {
    // A child's night is the same length either way (bed 20:30 → up 7:00, bed 21:00 → up 7:30): a late bed does not cost
    // sleep, it costs the morning. That is the whole lesson, so the bed card shows the wake-up time, not the hours.
    const slept = (isChild(state) ? wakeAfter(bedAt) : DAY_START) + 24 * 60 - bedAt;
    const bonus = Math.min(BONUS_MAX, Math.floor(Math.max(0, slept - SLEEP_NEED) / 60) * BONUS_PER_HOUR);
    return { slept, need: SLEEP_NEED, short: Math.max(0, SLEEP_NEED - slept), bonus };
  }
  const sleepIfBedNow = (state) => nightMath(state, Math.min(state.time, latestOf(state)));

  function isOpen(state, place, at) {
    const p = PLACES[place]; const t = at == null ? state.time : at;
    if (!p) return false;
    if (p.weekdaysOnly && isWeekend(state.day)) return false;
    if (p.open == null) return true;
    return t >= p.open && t < p.close;
  }
  const unlockDayOf = (state, place) => (isChild(state) && PLACES[place].childUnlockDay) || PLACES[place].unlockDay;
  const unlocked = (state, place) => {
    const p = PLACES[place];
    if (p.mode && p.mode !== (isChild(state) ? 'child' : 'adult')) return false; // the bakery is the grown-up's, school is the child's
    return state.day >= unlockDayOf(state, place);
  };
  const stallOpen = (state, stall) => state.day >= STALL_UNLOCK[stall];
  const shiftAt = (time) => SHIFTS.find(s => time >= s.start && time < s.end) || null;
  const nextShift = (time) => SHIFTS.find(s => s.start > time) || null;

  // ---- time & needs ----
  function advance(state, minutes, cat, out) {
    const from = state.time, step = stepOf(state), slots = slotsOf(state), last = latestOf(state), hunger = hungerOf(state);
    for (let i = 0; i < minutes / step; i++) {
      if (state.time >= last) break; // too late: whatever we were doing, we fall asleep
      const slot = (state.time - DAY_START) / step;
      if (slot >= 0 && slot < slots) state.timeline[slot] = cat;
      state.time += step;
      state.tummy = clamp(state.tummy - hunger, 0, TUMMY_MAX);
    }
    out.steps.push({ cat, from, to: state.time });
  }
  // With an empty tummy, an empty fridge and no way to buy food, the only way out is sleeping — so say that, instead of
  // "eat first", which would be advice for something the player cannot do.
  function foodTrapped(state) {
    if (isChild(state)) return false; // in child mode meals are the grown-ups' job — there is always something to eat
    if (state.tummy > 0 || state.fridge > 0 || state.lunchbox) return false;
    const canBuyFood = stallOpen(state, 'food') && state.coins >= ITEMS.meals.price;
    const canEatOut = state.coins >= 2; // the café or the restaurant
    return !canBuyFood && !canEatOut;
  }
  function needHints(state, out) {
    if (state.time >= bedtimeOf(state) && !state.flags.hBedtime) return; // the bedtime message takes over this once
    let hinted = false;
    if (isChild(state)) { // one body meter, called health: it only says something when it is getting low
      if (state.tummy <= 2 && !state.flags.hLowHealth) { out.msgs.push({ key: 'lowHealth' }); state.flags.hLowHealth = true; hinted = true; }
      if (!hinted && state.happy <= 1 && !state.flags.hBored) { out.msgs.push({ key: 'bored' }); state.flags.hBored = true; hinted = true; }
      if (!hinted && state.wish && state.coins >= ITEMS[state.wish].price && !state.wishReadyTold) {
        out.msgs.push({ key: 'wishReady', item: state.wish }); state.wishReadyTold = true;
      }
      return;
    }
    if (foodTrapped(state) && !state.flags.hNoFood) { out.msgs.push({ key: 'nothingToEat' }); state.flags.hNoFood = true; hinted = true; }
    else if (state.tummy <= 0 && !state.flags.hStarving) { out.msgs.push({ key: 'starving' }); state.flags.hStarving = true; hinted = true; }
    else if (state.tummy <= 1 && state.tummy > 0 && !state.flags.hHungry) { out.msgs.push({ key: 'hungry' }); state.flags.hHungry = true; hinted = true; }
    if (!hinted && state.happy <= 0 && !state.flags.hSad) { out.msgs.push({ key: 'tooSad' }); state.flags.hSad = true; hinted = true; }
    else if (!hinted && state.happy <= 1 && state.happy > 0 && !state.flags.hBored) { out.msgs.push({ key: 'bored' }); state.flags.hBored = true; hinted = true; }
    if (!hinted && state.wish && state.coins >= ITEMS[state.wish].price && !state.wishReadyTold) {
      out.msgs.push({ key: 'wishReady', item: state.wish }); state.wishReadyTold = true;
    }
  }
  function ate(state, amount) { state.tummy = clamp(state.tummy + amount, 0, TUMMY_MAX); state.flags.hHungry = false; state.flags.hStarving = false; state.flags.hNoFood = false; if (amount > 0) state.flags.hLowHealth = false; }
  function cheer(state, amount) { state.happy = clamp(state.happy + amount, 0, HAPPY_MAX); if (amount > 0) { state.flags.hBored = false; state.flags.hSad = false; } }
  function pay(state, n, out) { state.coins -= n; state.today.spent += n; state.totals.spent += n; out.coins -= n; }
  function earn(state, n, out) { if (!n) return; state.coins += n; state.today.earned += n; state.totals.earned += n; out.coins += n; }

  const walkMin = (state) => isChild(state) ? CHILD.walk : TRAVEL.walk.min; // a child's world is close by: everything is a short walk
  function fallAsleep(state, out, key) { // the day is over
    out.msgs = out.msgs.filter(m => m.key !== 'rested');
    out.msgs.push({ key });
    state.bedAt = Math.min(state.time, latestOf(state));
    if (isChild(state)) out.msgs.push({ key: state.bedAt <= CHILD.goodBed ? 'bedEarly' : 'bedLate', t: wakeAfter(state.bedAt) });
    state.phase = 'summary'; out.bedtime = true;
  }
  function checkBedtime(state, out) {
    if (state.phase !== 'day') return;
    if (state.time >= bedtimeOf(state) && !state.flags.hBedtime) { // bedtime, but staying up a little is allowed (at home)
      state.flags.hBedtime = true;
      out.msgs = out.msgs.filter(m => m.key !== 'rested');
      if (state.loc !== 'home') { out.msgs.push({ key: 'late' }); advance(state, walkMin(state), 'travel', out); state.loc = 'home'; }
      else out.msgs.push({ key: 'bedtime' });
    }
    if (state.time >= latestOf(state)) fallAsleep(state, out, isChild(state) ? 'tooLate' : 'midnight');
  }

  // ---- actions ----
  function actions(state) {
    const list = [], s = state, wk = isWeekend(s.day);
    const openNow = isOpen(s, s.loc);
    const closedMsg = () => PLACES[s.loc].weekdaysOnly && wk ? { key: 'closedToday', place: s.loc } : { key: 'closed', place: s.loc, t: PLACES[s.loc].open };
    const hungryBlock = s.tummy <= 0 ? { key: 'starving' } : null;
    const sadBlock = s.happy <= 0 ? { key: 'tooSad' } : null;
    const add = (a) => list.push(Object.assign({ enabled: true, cost: 0, earn: 0, minutes: 0, tummy: 0, happy: 0, fridge: 0 }, a));
    const lunchBreak = s.time >= LUNCH_FROM && s.time < LUNCH_TO, night = s.time >= BEDTIME;
    if (isChild(s)) return childActions(s, list, add);

    if (s.loc === 'home') {
      add({ id: 'cook', emoji: '🍳', cat: 'eat', minutes: 30, tummy: 4, happy: 1, fridge: -1, enabled: s.fridge > 0, why: s.fridge > 0 ? null : { key: 'noMeals' } });
      if (!wk && !s.lunchbox && !night && s.day >= LUNCHBOX_FROM) add({ id: 'pack', emoji: '🍱', cat: 'eat', minutes: 30, fridge: -1, enabled: s.fridge > 0, why: s.fridge > 0 ? null : { key: 'noMeals' } });
      if (s.toys.length) add({ id: 'toy', emoji: ITEMS[s.toys[s.toys.length - 1]].emoji, cat: 'play', minutes: 60, happy: 1, enabled: !hungryBlock, why: hungryBlock });
      else if (s.day >= STALL_UNLOCK.toys) add({ id: 'toy', emoji: '🧸', cat: 'play', minutes: 60, happy: 1, enabled: false, why: { key: 'noToy' } });
    }
    if (s.loc === 'bakery') {
      const shift = shiftAt(s.time), next = nextShift(s.time);
      let work;
      if (!openNow) work = { enabled: false, why: closedMsg() };
      else if (lunchBreak) work = { enabled: false, why: { key: 'lunchBreak' } };
      else if (shift) {
        const minutes = shift.end - s.time, hours = minutes / 60;
        work = { enabled: !hungryBlock && !sadBlock, why: hungryBlock || sadBlock, minutes, until: shift.end,
                 earn: Math.ceil(hours) * WORK_PAY, happy: -(Math.round(hours * -WORK_HAPPY) || 1) };
      } else if (next) work = { enabled: false, why: { key: 'shiftStarts', t: next.start }, until: next.start };
      else work = { enabled: false, why: { key: 'shiftOver' } };
      add(Object.assign({ id: 'work', emoji: '🥖', cat: 'work' }, work));
      add({ id: 'cafe', emoji: '🍲', cat: 'eat', minutes: 30, cost: 2, tummy: 4, happy: 1, enabled: openNow && s.coins >= 2, why: !openNow ? closedMsg() : { key: 'notEnough', n: 2 - s.coins } });
    }
    if (s.lunchbox) add({ id: 'lunchbox', emoji: '🍱', cat: 'eat', minutes: 30, tummy: 4, happy: 1 });
    if (s.loc === 'shops') {
      add({ id: 'shop', emoji: '🛒', cat: 'shop', minutes: 30, enabled: openNow, why: openNow ? null : closedMsg(), sheet: true });
      add({ id: 'restaurant', emoji: '🍝', cat: 'eat', minutes: 30, cost: 2, tummy: 4, happy: 1, enabled: openNow && s.coins >= 2, why: !openNow ? closedMsg() : { key: 'notEnough', n: 2 - s.coins } });
    }
    if (s.loc === 'park') {
      add({ id: 'play', emoji: '🛝', cat: 'play', minutes: 60, happy: 2, enabled: !hungryBlock, why: hungryBlock });
      add({ id: 'icecream', emoji: '🍦', cat: 'eat', minutes: 30, cost: 1, happy: 1, tummy: 1, enabled: s.coins >= 1, why: { key: 'notEnough', n: 1 - s.coins } });
      if (s.day >= SHOW_UNLOCK) add({ id: 'show', emoji: '🎭', cat: 'play', minutes: 60, cost: 2, happy: 3, enabled: s.coins >= 2, why: { key: 'notEnough', n: 2 - s.coins } });
    }
    add({ id: 'rest', emoji: '😌', cat: 'wait', minutes: 30, happy: 1 });
    if (s.loc === 'home') { // at home you can always go to bed; the card shows how long the night would be and the happiness bonus
      const n = sleepIfBedNow(s);
      add({ id: 'bed', emoji: '🛏️', cat: 'sleep', sleep: n.slept, sleepShort: n.short > 0, happy: n.bonus, urge: foodTrapped(s) });

  }

  // What the day is asking right now, or null when the child is free to choose. One at a time, always at home, in the
  // order the questions are written above.
  function question(state) {
    if (!isChild(state) || state.phase !== 'day' || state.loc !== 'home') return null;
    for (const id of Object.keys(CHORE)) {
      const c = CHORE[id];
      if (settled(state, id)) continue;
      if (c.weekendOnly && !isWeekend(state.day)) continue;
      if (c.bathDayOnly && !bathDay(state)) continue;
      if (!c.due(state)) continue;
      return { id, emoji: c.emoji, yes: c.emoji, no: c.no, tier: c.tier, minutes: c.minutes,
               tummy: c.tummy || 0, happy: c.happy || 0, skipTummy: c.skipTummy || 0, skipHappy: c.skipHappy || 0 };
    }
    // Bedtime is a question too, and the only one whose "no" costs tomorrow morning rather than a meter.
    if (state.time >= CHILD.goodBed && !settled(state, 'bed')) {
      const n = nightMath(state, state.time);
      return { id: 'bed', emoji: '🛏️', yes: '🛏️', no: '🦉', tier: 'choice', minutes: 0,
               tummy: 0, happy: 0, skipTummy: 0, skipHappy: 0, sleep: n.slept, wake: wakeAfter(state.time) };
    }
    return null;
  }

  function answer(state, id, yes) {
    const out = { ok: false, msgs: [], steps: [], coins: 0, bedtime: false };
    const q = question(state);
    if (!q || q.id !== id) return out;
    if (id === 'bed') {
      out.ok = true;
      if (yes) { fallAsleep(state, out, 'goBed'); return out; }
      state.skipped.bed = true; // staying up: the day runs on to 21:00 and tomorrow starts half an hour late
      out.msgs.push({ key: 'stayedUp', t: CHILD.wakeLate });

    }
    const c = CHORE[id];
    if (!yes && c.tier === 'must') { out.msgs.push({ key: c.skipMsg }); return out; } // the question stays; nothing moves
    out.ok = true;
    if (yes) choreOut(state, id, out);
    else { // saying no costs no time at all — that is exactly why it is tempting, and why it shows on a meter

  // ---------- clock svg ----------
  function clockSVG(prefix) {

      nums += `<text x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="Fredoka, ui-rounded, 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="${i >= 10 ? 19 : 21}" fill="#33241A">${i}</text>`; }
    let ticks = '';
    for (let i = 0; i < 60; i++) { if (i % 5 === 0) continue; const a = (i / 60) * Math.PI * 2; const x1 = 100 + 86 * Math.sin(a), y1 = 100 - 86 * Math.cos(a), x2 = 100 + 90 * Math.sin(a), y2 = 100 - 90 * Math.cos(a);
      ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#B8773F" stroke-width="2" stroke-linecap="round"/>`; }

      <circle cx="100" cy="100" r="7" fill="#33241A"/><circle cx="100" cy="100" r="3" fill="#E4526E"/>

    if (!animate) { void h.getBoundingClientRect(); h.style.transition = ''; m.style.transition = ''; }
  }
  const absMin = (day, time) => (day - 1) * 1440 + time;

  // ---------- sky ----------
  function setSky(time, dur) {
    const sky = $('sky'); const clamp = (v) => Math.max(0, Math.min(1, v));
    const bed = S ? E.bedtimeOf(S) : E.BEDTIME; // dusk falls at the mode's bedtime
    const dayOp = clamp(Math.min((time - 420) / 60, (bed - time) / 120));
    const nightOp = time >= bed - 30 ? clamp((time - (bed - 30)) / 60) : clamp((420 - time) / 60);
    const p = clamp((time - 420) / (bed - 420)), ang = Math.PI - p * Math.PI;
    const sx = 50 + 42 * Math.cos(ang), sy = 84 - 72 * Math.sin(ang);
    const d = (dur || 1) + 's';
    sky.querySelector('.day').style.opacity = dayOp; sky.querySelector('.dusk').style.opacity = 1 - dayOp;
    sky.querySelector('.nightl').style.opacity = nightOp; sky.querySelector('.stars').style.opacity = nightOp;
    sky.querySelectorAll('.layer, .stars').forEach(el => el.style.transitionDuration = d);
    const sun = $('sun'), moon = $('moon');
    sun.style.transitionDuration = `${d}, ${d}, .8s`; sun.style.left = sx + '%'; sun.style.top = sy + '%'; sun.style.opacity = 1 - nightOp;
    moon.style.left = '50%'; moon.style.top = '18%'; moon.style.opacity = nightOp > .5 ? 1 : 0;

  // ---------- day bar: 24 hours from 7:00, the plan for the day (+ a preview of the next action) ----------
  // Cells after the mode's bedtime are "late" (you may still stay up); from the real bedtime (bedAt) on, the night is dark.
  // Each hour is split into as many pieces as the mode's step: halves for a grown-up, quarters for a child, whose
  // routine happens in fifteen-minute bites.
  function renderDayBar(container, timeline, time, bands, preview, bedAt) {
    const step = S ? E.stepOf(S) : E.STEP, per = 60 / step, slots = S ? E.slotsOf(S) : E.SLOTS;
    const bedHour = ((S ? E.bedtimeOf(S) : E.BEDTIME) - E.DAY_START) / 60, latestHour = ((S ? E.latestOf(S) : E.LATEST_BED) - E.DAY_START) / 60;
    const col = (c) => c ? E.CAT_COLORS[c] : 'transparent';
    const pv = {}; // slot -> cat for the preview
    if (preview && time != null) for (let i = 0; i < preview.minutes / step; i++) { const slot = (time - E.DAY_START) / step + i; if (slot >= 0 && slot < slots && !timeline[slot]) pv[slot] = preview.cat; }
    const nightSlot = bedAt != null ? (bedAt - E.DAY_START) / step : slots; // first piece of the day that is asleep
    const NIGHT = 'var(--night-2)';
    const piece = (slot) => slot >= nightSlot ? NIGHT : timeline[slot] ? col(timeline[slot]) : 'transparent';
    let cells = '';
    for (let i = 0; i < 24; i++) {
      const s0 = i * per;
      if (s0 >= nightSlot || i >= latestHour) { cells += '<i class="c night"></i>'; continue; }
      let inner = '', anyPv = false;
      for (let k = 0; k < per; k++) {
        const x = s0 + k, isPv = pv[x] != null && !timeline[x]; if (isPv) anyPv = true;
        inner += `<b style="background:${isPv ? `repeating-linear-gradient(135deg, ${E.CAT_COLORS[pv[x]]} 0 3px, rgba(255,255,255,.55) 3px 6px)` : piece(x)}"></b>`;
      }
      cells += `<i class="c${anyPv ? ' pv' : ''}${i >= bedHour ? ' late' : ''}">${inner}</i>`;
    }
    // The whole strip is one target that reads out what is happening now — ten separate 7 px bands were untappable.
    const plan = (bands || []).map(b => `<span class="band" style="left:${((b.from - 7) / 24 * 100).toFixed(2)}%;width:${((b.to - b.from) / 24 * 100).toFixed(2)}%;background:${E.CAT_COLORS[b.cat]}"><em>${b.emoji}</em></span>`).join('');

    // The bar spans a whole day, so 12 h numbers would repeat (7, 9, 11, 1, 3, 5, 7, 9 …) and mean nothing.
    // Three pictures say the same thing to a child who cannot read a clock yet: get up, midday, bedtime.
    const MARKS = [[0, '🌅'], [5, '☀️'], [((S ? E.bedtimeOf(S) : E.BEDTIME) - E.DAY_START) / 60, '🌙']];
    const labels = MARKS.map(([i, ico]) => `<span style="left:${(i / 24 * 100).toFixed(2)}%${i ? '' : ';transform:none'}">${ico}</span>`).join('');
    const pct = (tt) => Math.min(100, Math.max(0, (tt - E.DAY_START) / 1440 * 100)).toFixed(2);
    let markers = '';
    if (time != null) {
      markers += `<div class="now" style="left:${pct(time)}%"></div>`;
      if (preview) { const end = Math.min(time + preview.minutes, E.LATEST_BED), pe = +pct(end);
        const lb = pe < 7 ? 'left:0;transform:none;' : pe > 93 ? 'left:auto;right:0;transform:none;' : '';
        markers += `<div class="ghost" style="left:${pe}%"><b style="${lb}">${fmtTime(end)}</b></div>`; }
    }
    if (time != null) { container.setAttribute('role', 'button'); container.setAttribute('tabindex', '0'); container.dataset.plan = 'now'; }
    container.innerHTML = `<div class="cells">${cells}</div><div class="plan">${plan}</div><div class="labels">${labels}</div>${markers ? `<div class="track">${markers}</div>` : ''}`;
  }

  function renderActions() {

    if (b.parentElement && b.parentElement.id === 'setLang') { settings.lang = b.dataset.v; saveSettings(); applyI18n(); if (S) renderAll(); return; }
    if (b.parentElement && b.parentElement.id === 'setClock') { settings.clock24 = b.dataset.v === '24'; saveSettings(); applyI18n(); if (S) renderAll(); return; }
    if (b.parentElement && b.parentElement.id === 'setSound') { settings.sound = b.dataset.v === '1'; saveSettings(); applyI18n(); return; }
    if (b.parentElement && b.parentElement.id === 'setVoice') { settings.voice = b.dataset.v === '1'; saveSettings(); applyI18n(); if (!settings.voice && window.speechSynthesis) speechSynthesis.cancel(); return; }
    if (b.id === 'btnReset') { $('resetConfirm').classList.remove('hidden'); return; }
    if (b.id === 'btnResetNo') { $('resetConfirm').classList.add('hidden'); return; }
    if (b.id === 'btnResetYes') { resetGame(); return; }
  });

  // Press a card and it tells you what it does, then shows its time on the bar and its effect on the meters.
  // A quick tap plays it; holding for HOLD_MS means "just read it to me".
  (() => {
    const from = (ev) => ev.target.closest && ev.target.closest('[data-act], [data-mode], [data-ans]');
    const effOf = (el) => el.dataset.act ? lastActions[el.dataset.act]
      : el.dataset.mode ? lastModes[el.dataset.mode]
      : lastQuestion ? answerEffect(lastQuestion, el.dataset.ans === 'yes') : null;
    const press = (ev) => {
      const el = from(ev); if (!el) return;
      const eff = effOf(el); if (!eff) return;
      speak(el.dataset.act ? sayAction(eff) : el.dataset.mode ? sayMode(eff) : sayAnswer(lastQuestion, el.dataset.ans === 'yes'));
      if (el.dataset.ans && !+el.dataset.min) { showPreview(eff); heldEl = null; clearTimeout(holdTm); holdTm = setTimeout(() => { heldEl = el; }, HOLD_MS); return; }
      if (eff.enabled !== false && +el.dataset.min > 0) showPreview(eff);
      heldEl = null; clearTimeout(holdTm); holdTm = setTimeout(() => { heldEl = el; }, HOLD_MS);
    };
    const release = () => { clearTimeout(holdTm); clearPreview(); };
    document.addEventListener('pointerdown', press);
    document.addEventListener('focusin', press);
    document.addEventListener('pointerup', release);
    document.addEventListener('pointercancel', () => { clearTimeout(holdTm); heldEl = null; clearPreview(); });
    document.addEventListener('focusout', release);
  })();

  // gear: hold to open (keeps little fingers out of settings)
  (() => { const g = $('gear'); let tm = null;
    const start = (e) => { e.preventDefault(); g.classList.add('holding'); tm = setTimeout(() => { tm = null; g.classList.remove('holding'); $('settings').classList.add('open'); SFX.open(); }, 1100); };
    const stop = () => { if (tm) { clearTimeout(tm); tm = null; toast(t('settings.hold')); } g.classList.remove('holding'); };
    g.addEventListener('pointerdown', start); g.addEventListener('pointerup', stop); g.addEventListener('pointercancel', stop); g.addEventListener('pointerleave', stop);
    g.addEventListener('click', (e) => e.preventDefault());
  })();

  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  // ---------- boot ----------
  $('clock').innerHTML = clockSVG('c');
  sortOutSaves();
  renderStart();
  // expose for tests
  window.TS = { get state() { return S; }, settings, start: startGame, act: doAction, travel: (d, m) => { travelDest = d; return doTravel(m); }, goTo: openTravelTo, buy: doBuy, wish: doWish, sleep: goToSleep, wake, showSummary, undo: doUndo, render: renderAll, engine: E, isBusy: () => busy };
})();

</script>
</body>
